# Light fixture palette for scripts/theme-templates/check.sh (dev-only).
# The light-mode counterpart of fixture-palette.properties: the same key set,
# the same hue family, plausible Material 3 light values and a light ANSI set.
# check.sh renders `{{ colors.<token>.light.<format> }}` from this file and
# `{{ colors.<token>.dark.<format> }}` from the dark one, so a template that
# carries both palettes can be checked for two genuinely different halves.
# Not shipped in the APK.

mode=light
contrast_level=default

