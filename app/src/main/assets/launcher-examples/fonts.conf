# ~/.termux/fonts.conf
#
# Terminal fonts, symbol maps, shaping, and cell metrics for Termux Launcher.
#
# This file ships with the app and every directive below is commented out, so
# as it stands it changes nothing: native Termux font handling stays in charge.
# With no active directive here the regular face comes from ~/.termux/font.ttf,
# the optional italic from ~/.termux/font-italic.ttf, and Android monospace is
# the final fallback — so Termux:Styling and manual font.ttf replacement keep
# working exactly as before.
#
# If you would rather not write any of this by hand, the app has a picker:
# Settings > Appearance > Terminal fonts. Pick a family from its list (a star
# marks the suggested one, Maple Mono) and it installs the faces with Nerd Font
# icons and writes ~/.termux/fonts.d/10-launcher.conf for you.
#
# The picker never touches ~/.termux/font.ttf or font-italic.ttf. Those stay
# yours: installing a family changes the terminal only, and anything reading
# font.ttf directly is unaffected. Note that a family's line metrics set the
# cell height, so a taller face fits fewer rows and a running full-screen TUI
# may reflow or look truncated until it resizes itself.
#
# Precedence, once and for all: ~/.termux/fonts.d/*.conf is read first in
# filename order, and this file is read last. A later duplicate directive
# replaces an earlier one, so anything you set here overrides the app-managed
# fragment and any third-party drop-in — while a directive you leave commented
# out keeps whatever the fragment set. Both of those beat font.ttf.
#
# Apply changes without restarting the app:
#
#     termux-reload-settings
#
# A pristine copy of this file is refreshed at every app start in:
#
#     ~/.termux/launcher/examples/fonts.conf
#
# Your edits here are never overwritten by an app update.
#
# Syntax notes: `~/` expands to the Termux home directory, values may be
# quoted, `#` starts a comment, and a later duplicate directive replaces an
# earlier one. Limits: 64 KiB, 512 lines, 4096 characters per line. The
# fonts.d directory adds its own bounds: 32 files and 256 KiB across all of
# them, which never eats into this file's own 64 KiB allowance.
#
# Full reference: docs/en/Terminal_Modernization.md in the project repository.


## ---------------------------------------------------------------------------
## Faces
## ---------------------------------------------------------------------------
#
# Give each face its own file. Real bold, italic, and bold-italic faces are
# used when provided; a missing face falls back to safe synthetic styling.
# Paths are the reliable Android case. A family= lookup asks Android to resolve
# a system family and is best-effort only.
#
# There are four faces and no more, because ANSI SGR only distinguishes bold
# times italic — no escape sequence asks for a fifth. That is a protocol limit,
# not a limit on how many font files can be active: the symbol maps and the
# fallback chain below add plenty more.

# font_family path=~/.termux/font.ttf
# bold_font path=~/.termux/font-bold.ttf
# italic_font path=~/.termux/font-italic.ttf
# bold_italic_font path=~/.termux/font-bold-italic.ttf
# bold_font family="Roboto Mono"


## ---------------------------------------------------------------------------
## Symbol maps
## ---------------------------------------------------------------------------
#
# Route selected Unicode ranges to another font — the usual reason is a Nerd
# Font for powerline and icon glyphs without changing the text face. Ranges are
# comma-separated U+CODEPOINT or inclusive U+START-U+END. Repeatable (up to 256
# directives, 1024 ranges, 64 distinct font files); a later overlapping map
# wins. Symbol fonts never change the cell width.

# symbol_map U+E000-U+F8FF path=~/.termux/fonts/SymbolsNerdFontMono.ttf
# symbol_map U+E0A0-U+E0D7,U+F0001 family="Symbols Nerd Font Mono"

# Name a map when two symbol fonts need different features or axes. `name=` may
# sit on either side of the ranges but only once per line; names are 1-32
# characters of A-Z a-z 0-9 _ - matched case-insensitively, and the words
# regular, bold, italic, bold_italic and symbols are reserved. A name may be
# declared in a later file than the line that references it.

# symbol_map name=nerd U+F0000-U+FFFFD path=~/.termux/fonts/symbols/SymbolsNerdFontMono.ttf

# A private-use symbol whose glyph is wider than one cell spreads into the blank
# cells after it — space or en-space, and only while they paint the same — so a
# Nerd Font icon drawn on an em square is not shrunk to a narrow cell's width.
# It asks for ceil(advance / cell width) cells and never takes more than five.
# `narrow_symbols` caps that per range; the count defaults to 1, and for a code
# point matched twice the last line wins. The Powerline separators are drawn as
# geometry and never expand, so they need no rule unless powerline_symbols font
# hands them back to the face.

# narrow_symbols U+E0A0-U+E0A3,U+E0C0-U+E0C7
# narrow_symbols U+F0000-U+FFFFD 3


## ---------------------------------------------------------------------------
## Fallback fonts
## ---------------------------------------------------------------------------
#
# The answer to "Android substituted a CJK or emoji font I did not choose".
# Repeatable up to 8 entries; order of appearance is the order they are tried,
# and the chain is only consulted for code points the run's own face genuinely
# lacks. After it, Android's own platform fallback still applies.
#
# Full per-cell order: an explicit symbol_map, then box-drawing synthesis, then
# the configured face for the cell's SGR style, then this chain, then Android.
# A fallback face never changes the cell width.

# fallback_font path=~/.termux/fonts/NotoSansMono-Regular.ttf
# fallback_font family="Noto Sans Symbols 2"


## ---------------------------------------------------------------------------
## Ligatures, OpenType features, variable axes
## ---------------------------------------------------------------------------
#
# disable_ligatures: never (default), cursor, or always. It controls
# programming ligatures only — Arabic, Indic, emoji, and combining-mark shaping
# are unaffected.
#
# The feature and variation directives target regular, bold, italic,
# bold_italic, symbols, or the name of a symbol_map declared above. Tokens are
# +tag, -tag, or tag=value; axes are tag=value. At most 32 features and 16 axes
# per target. `none` clears a target's previous setting. A static font may
# silently ignore an axis, so use a real variable font when axis changes matter.

# disable_ligatures cursor
# font_features regular +zero -liga cv01=2
# font_features symbols +ss01
# font_features nerd +ss01
# font_variations regular wght=425 wdth=92.5
# font_variations nerd wght=600


## ---------------------------------------------------------------------------
## Box drawing, blocks, braille and powerline
## ---------------------------------------------------------------------------
#
# By default these cells are drawn as geometry rather than shaped from the
# font: U+2500-U+259F (lines, blocks, shades), U+25E2-U+25E5 (corner
# triangles), U+2800-U+28FF (braille), U+1FB00-U+1FB3B (sextants) and
# U+1FB70-U+1FB8F (legacy eighth blocks and half shades).
#
# The reason is joins. Every edge is snapped to a shared integer pixel, and
# both cells meeting at a boundary compute it the same way, so frames, block
# ramps and braille graphs stay seamless at any cell size — including one
# resized by the cell_width/cell_height knobs below — instead of showing the
# hairline gaps a font's own glyph metrics leave at fractional sizes. Shades are
# drawn at 25%, 50% and 75% foreground alpha, so they follow colour, dim and
# selection.
#
# `box_drawing font` hands every one of them back to the font, unchanged from
# older releases. An explicit symbol_map always wins over synthesis.
#
# Not synthesized, so these still come from the font: the wedges at
# U+1FB3C-U+1FB6F, the inverse shades, pattern fills and segmented digits at
# U+1FB90-U+1FBFF, and the octant block at U+1CD00-U+1CDE5.

# box_drawing synthesize

# Stroke multipliers for the thin, light, heavy and very heavy line weights,
# comma or space separated, each greater than 0 and at most 8. The base stroke
# is a sixteenth of the cell height. Default:

# box_drawing_scale 0.001,1,1.5,2

# Powerline separators (U+E0B0-U+E0B7, U+E0BA-U+E0BD) are synthesized as
# geometry by default, like Kitty draws them itself: their edges sit flush
# with the cell so consecutive separators butt together with no sliver of
# background. Synthesis needs box_drawing synthesize as well. `font` hands
# them back to the font, for a patched Nerd Font whose author drew their own.

# powerline_symbols synthesize


## ---------------------------------------------------------------------------
## Cell and decoration metrics
## ---------------------------------------------------------------------------
#
# A percentage (10%..500%) replaces the font-derived metric. A value ending in
# px, or a bare number, adds pixels (-256..256) — bare values are Android
# pixels, not kitty desktop point units. `none` clears an adjustment.
# A positive baseline raises glyphs; a positive decoration position moves that
# decoration downward.

# modify_font cell_width 90%
# modify_font cell_height 2px
# modify_font baseline 1px
# modify_font underline_position 1px
# modify_font underline_thickness 150%
# modify_font strikethrough_position -1px
# modify_font strikethrough_thickness 125%


## ---------------------------------------------------------------------------
## Safety
## ---------------------------------------------------------------------------
#
# Font files are untrusted input parsed by Android. Files over 64 MiB,
# unreadable files, malformed fonts, and invalid settings are rejected with a
# bounded error and a safe fallback rather than a crash. Keep font files
# owner-writable only and take them from a source you trust.
#
# Errors coming from a drop-in are prefixed `fonts.d/<file>: ` so the line
# number they report is unambiguous; messages about this file are not prefixed.
