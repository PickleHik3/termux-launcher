# ~/.termux/termux-launcher-bindings.conf
#
# Key bindings for Termux Launcher, in a kitty-inspired syntax.
#
# This file ships with the app and every directive below is commented out, so
# as it stands it changes nothing: the built-in bindings all stay active.
# Uncomment a line to make it real, or write your own.
#
# Apply changes without restarting the app:
#
#     termux-reload-settings
#
# A pristine copy of this file is refreshed at every app start in:
#
#     ~/.termux/launcher/examples/termux-launcher-bindings.conf
#
# Your edits here are never overwritten by an app update.
#
# Syntax
#   map    [--label "Display name"] <sequence> <action> [arguments...]
#   unmap  <sequence>
#
# Naming a root sequence with map or unmap replaces every built-in mapping for
# that exact sequence. Modifier names (ctrl, alt, shift) and multi-character key
# names (left, pageup, f5) are case-insensitive, but an UPPER-CASE letter is
# itself Shift:
#
#     map Ctrl+Alt+r  window.rename_prompt     # ctrl+alt+r
#     map Ctrl+Alt+R  session.rename_prompt    # ctrl+alt+shift+r
#
# both spellings are accepted anywhere, so `ctrl+alt+shift+r` names the same
# stroke as `Ctrl+Alt+R`. `>` separates the strokes of a multi-key chord. `#`
# starts a comment. Quote values containing spaces. Invalid lines are skipped
# and reported; valid lines stay active.
#
# Whatever this file binds is what the rest of the app shows: the command
# palette's shortcut column, the keybind hint legend and the keys that light up
# on the in-app keyboard while Ctrl+Alt is latched all read these bindings.
#
# --label gives a binding the name that legend prints, up to 32 characters. It
# is worth setting on anything generic: every app chord runs the same
# app.launch action, so without a label the legend can only say "Launch app".
#
#     map --label WhatsApp ctrl+alt+w app.launch com.whatsapp
#     map --label "Work mail" ctrl+alt+m app.launch com.mail
#
# Without --label a binding keeps its action's own name, which already reads
# well for the specific ones (pane.equalize is "Equalize panes").
#
# Limits: 256 KiB, 4096 lines, 4096 characters per line.
#
# Default keybindings and the command palette:
# https://picklehik3.github.io/termux-launcher-site/#wiki/tour
# Terminal features these actions drive:
# https://picklehik3.github.io/termux-launcher-site/#wiki/surface
# Project reference: docs/en/Terminal_Modernization.md in the repository.


## ---------------------------------------------------------------------------
## Launch Android apps from a key chord
## ---------------------------------------------------------------------------
#
# app.launch takes a package name, an app label, or a stable id. An exact
# package match wins; otherwise the launcher's fuzzy app ranking picks the best
# match — the same ranking the suggestion bar uses. Add --label to name the
# chord in the keybind legend; without it the legend reads "Launch app".

# map --label WhatsApp ctrl+alt+w app.launch com.whatsapp
# map --label Maps ctrl+alt+shift+m app.launch Maps
# map --label Firefox ctrl+alt+shift+b app.launch "Firefox Nightly"

# Two-stroke chords keep single modifiers free for the shell. Press
# Ctrl+Alt+Space, release, then press the second key.

# map --label WhatsApp ctrl+alt+space>w app.launch com.whatsapp
# map --label Telegram ctrl+alt+space>t app.launch org.telegram.messenger
# map --label YouTube ctrl+alt+space>y app.launch "YouTube"

# Plain Alt+<letter> is possible but usually a bad idea in a terminal: many
# shells and editors expect Alt to send an Escape prefix, and a binding here
# takes the key before the shell sees it. Prefer Ctrl+Alt or a chord.

# map alt+w app.launch com.whatsapp

# You do not have to write these by hand. Long-press an app row in the command
# palette (or press Ctrl+Alt+Enter on it) and press a key combination: the
# palette appends the mapping below a managed header, labelled with the app
# name it showed, and keeps this file's comments, blank lines and ordering
# exactly as they are.


## ---------------------------------------------------------------------------
## Registry actions
## ---------------------------------------------------------------------------
#
# Any terminal action in the launcher registry can be bound. The same ids are
# used by the command palette (Ctrl+Alt+Shift+P) and the action sheet, so the
# palette is the quickest way to discover an id.

# map ctrl+alt+g pane.equalize
# map ctrl+alt+space>g pane.rotate
# map --when splits-on ctrl+alt+e pane.equalize

# Drop a built-in binding entirely.
# unmap ctrl+alt+u

# --when accepts always (default), splits-on, or splits-off.


## ---------------------------------------------------------------------------
## Action arguments
## ---------------------------------------------------------------------------
#
# Words after the action id are its arguments. Positional words fill the
# action's required arguments in schema order; name=value reaches any argument.
# Values are validated against the action's schema, so an out-of-range number
# or an unknown enum value is reported instead of silently running.

# map ctrl+alt+shift+1 pane.layout grid
# map ctrl+alt+shift+2 pane.move_to_edge left
# map ctrl+alt+shift+w window.select 0
# session.rename_at_index renames a tmux-style session by its zero-based index —
# a different object from session.rename, which renames the focused shell.
# Names are capped at 8 characters; an empty name clears the label.
# map ctrl+alt+shift+r session.rename_at_index 1 work
# map ctrl+alt+shift+n session.new name=build failsafe=false
# map ctrl+alt+shift+s workspace.save name=project overwrite=true
# map ctrl+alt+shift+r session.rename "build shell"


## ---------------------------------------------------------------------------
## Send input to the focused shell
## ---------------------------------------------------------------------------

# map --label Greet ctrl+alt+t send-text "echo hello from a binding\n"
# map ctrl+alt+enter send-key ctrl+c

# Repeating the same sequence appends to it, giving an ordered multi-action
# binding that runs top to bottom. One --label on the first line names the
# whole binding.

# map --label "Repo status" ctrl+alt+j send-text "cd ~/src\n"
# map ctrl+alt+j send-text "git status\n"


## ---------------------------------------------------------------------------
## Modal keymaps
## ---------------------------------------------------------------------------
#
# A root key can enter a named mode, like a tmux prefix that stays on. The mode
# can time out, decide what an unknown key does, and stay active or end after a
# matched action. --on-unknown accepts beep (default), ignore, end, or
# passthrough; --on-action accepts keep or end. Modes stack; pop-mode exits the
# top one. A non-focusable overlay shows the pending chord and active mode.

# map --new-mode nav --timeout 10 --on-unknown passthrough --on-action keep ctrl+alt+space
# map --mode nav h window.previous
# map --mode nav l window.next
# map --mode nav v pane.split_vertical
# map --mode nav w app.launch com.whatsapp
# map --mode nav q pop-mode
# map --mode nav escape pop-mode


## ---------------------------------------------------------------------------
## Notes
## ---------------------------------------------------------------------------
#
# - In-app keyboard swipes are not strokes and are not configured here. They
#   live in ~/.termux/keyboard/layout.xml; see the keyboard-layout.xml example.
# - Open Key inspector from the command palette (app.key_inspector) to see
#   which binding claims a key and what bytes reach the shell. It has no
#   built-in stroke; bind one with:  map ctrl+alt+shift+k app.key_inspector
# - Binding-file errors are logged and summarized in a toast; defaults are kept
#   wherever a line could not be used.
