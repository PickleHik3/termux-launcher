# ~/.termux/termux.properties
#
# Terminal and app behaviour for Termux Launcher.
#
# This file ships with the app and every property below is commented out, so as
# it stands it changes nothing: an all-comment file and no file at all mean the
# same thing. Uncomment what you want.
#
# It is written only when missing, so your edits survive app updates. To start
# over, copy the reference copy back:
#
#     cp ~/.termux/launcher/examples/termux.properties ~/.termux/
#
# Apply changes without restarting the app:
#
#     termux-reload-settings
#
# A running terminal session keeps the environment it was started with, so
# properties that shape a session's environment — TERM below — only reach
# sessions opened after the reload.
#
# This is the short, launcher-focused list. The full upstream example, with
# every extra-keys recipe and shortcut, is at
# https://github.com/PickleHik3/termux-launcher/blob/main/docs/en/examples/termux.properties
#
# Note that only one properties file is read: ~/.termux/termux.properties wins,
# and ~/.config/termux/termux.properties is used only when this file is absent.


### Terminal identity ########################################################

# The TERM value exported to new sessions. Default: xterm-256color.
#
# Most programs need no change here. Capability detection in this terminal works
# through XTVERSION, TERM_PROGRAM and XTSMGRAPHICS, so graphics and keyboard
# support are found by probing, not by the terminal's name.
#
# Set xterm-kitty only for programs that string-match the name instead of
# probing. That name also promises kitty features this terminal does not
# implement, such as remote control, so a program may take a path that fails.
#
# A TERM passed explicitly when a session is launched still wins over this.
#
# terminal-term = xterm-kitty


### Keys #####################################################################

# The volume keys change the volume. That is this fork's default and needs no
# property: a home launcher that swallows the volume rocker leaves nothing to
# change the volume with. Uncomment for upstream Termux behaviour, where the
# volume keys act as Ctrl and Fn.
#
# volume-keys = virtual

# Send Escape instead of leaving the app or hiding the keyboard.
#
# back-key = escape

# Let the keyboard toggle button enable or disable the software keyboard
# instead of showing and hiding it.
#
# soft-keyboard-toggle-behaviour = enable/disable

# Do not show the software keyboard when the app starts.
#
# hide-soft-keyboard-on-startup = true

# Extra keys above the keyboard. The launcher's own row ships as the default, so
# there is nothing to set here to get it — this property only overrides it.
# The `extrakeys.edit` action opens an editor that writes the property here for
# you; reach it from the command palette or a `tool:extrakeys.edit` key.
#
# Beyond the upstream syntax, a key can run any launcher action with
# `tool:<action-id>[:arg=value...]`; discover ids in the command palette
# (Ctrl+Alt+Shift+P). `extra-keys2` is the second page.
#
# extra-keys = [[ESC, TAB, CTRL, ALT, {key: '-', popup: '|'}, DOWN, UP]]


### Cursor and terminal ######################################################

# Cursor style: block, bar, underline.
#
# terminal-cursor-style = bar

# Cursor blink rate. 0 disables blinking; otherwise 100 - 2000.
#
# terminal-cursor-blink-rate = 600

# Scrollback lines per session. Max 50000. Large values cost memory.
#
# terminal-transcript-rows = 2000

# Margin in pixels between the terminal text and the edges of its pane.
#
# terminal-margin-horizontal = 0
# terminal-margin-vertical = 0


### Appearance ###############################################################

# Colour drawn over the wallpaper behind the terminal, as #AARRGGBB.
#
# background-overlay-color = #82141218

# Night mode: true, false, or system. This is also where the old use-black-ui
# ended up — that property is deprecated and rewritten to this one on load.
#
# night-mode = system


### App behaviour ############################################################

# Let other Android applications run commands in Termux. Off by default because
# any app holding the permission gets to run whatever it likes as you.
#
# allow-external-apps = true

# Working directory for new sessions.
#
# default-working-directory = /data/data/com.termux/files/home

# Do not toast when the terminal session changes.
#
# disable-terminal-session-change-toast = true

# Start in full screen.
#
# fullscreen = true

# Bell behaviour: vibrate (default), beep, or ignore.
#
# bell-character = vibrate
