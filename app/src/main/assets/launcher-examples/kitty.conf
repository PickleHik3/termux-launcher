# ~/.config/kitty/kitty.conf — what Termux Launcher reads from it
#
# This is a reference copy, not a file the app installs. Termux Launcher never
# creates ~/.config/kitty/kitty.conf: that file belongs to kitty and to tools
# that write into it. If you already keep one, or a tool writes one for you,
# the terminal reads its FONT directives with kitty's own spelling, so a line
# that works in kitty works here unchanged.
#
# Only the directives listed in this file are read. Every other kitty setting
# (colours, keyboard maps, window padding, background opacity, tabs, remote
# control, ...) is ignored without an error, and pasting more of your desktop
# configuration in will not make it take effect. The terminal is not kitty:
# TERM stays xterm-256color and kitty's remote control is not available.
#
# Precedence, weakest to strongest: this file, then ~/.termux/fonts.d/*.conf
# (including the app-managed 10-launcher.conf), then ~/.termux/fonts.conf.
# Anything set under ~/.termux wins over the same setting here. To override
# a font the app installed, write the line in ~/.termux/fonts.conf instead.
#
# Apply changes without restarting the app:
#
#     termux-reload-settings
#
# Errors from lines in this file are reported with the prefix `kitty.conf: `.
# Limits: 64 KiB and 8192 lines, `include` one level deep. globinclude,
# envinclude and geninclude are skipped.

# ---------------------------------------------------------------------------
# Faces. `auto` leaves the face to the terminal. A bare name is looked for in
# ~/.termux/fonts, ~/.fonts and ~/.local/share/fonts before Android's own
# families, so a font you copied into place is found by file name. A family
# nothing has is reported as not installed, and the face falls back.
# ---------------------------------------------------------------------------

# font_family      Maple Mono
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

# kitty's key=value spec is accepted too. `features=` and any axis such as
# `wght=` apply to that face; `style=` and `variable_name=` are accepted and
# ignored. `postscript_name=` and `full_name=` are looked up as a family.

# bold_font family="Fira Code" style=Bold wght=600 features="+zero"

# ---------------------------------------------------------------------------
# Symbol maps: code point ranges served by another font. The family is the rest
# of the line, spaces included. A later map wins each code point it covers and
# can draw; a code point its font lacks falls back to the next map that has it,
# then to your text font.
# ---------------------------------------------------------------------------

# symbol_map U+E1A0-U+E1B6,U+E1C0-U+E1C5 Herdr Agent Icons Max
# narrow_symbols U+E0B0-U+E0B3 1

# ---------------------------------------------------------------------------
# Shaping and metrics.
# ---------------------------------------------------------------------------

# The target is kitty's PostScript name; a face name (regular, bold, italic,
# bold_italic, symbols) or a family name you used above works as well.
# font_features FiraCode-Retina +zero +onum
# disable_ligatures cursor

# A value without a unit is pixels here, not points. Metrics: cell_width,
# cell_height, baseline, underline_position, underline_thickness,
# strikethrough_position, strikethrough_thickness. `size` is not supported.
# modify_font cell_height -2px
# modify_font underline_position 120%
# box_drawing_scale 0.001, 1, 1.5, 2

# ---------------------------------------------------------------------------
# Not read, listed so you do not wait for them: font_size, adjust_line_height,
# adjust_column_width, text_composition_strategy, undercurl_style, foreground,
# background, background_opacity, window_padding_width, cursor_*, map,
# kitten, allow_remote_control, listen_on, shell, term, and every other kitty
# option. Set the equivalents in the app's Settings or ~/.termux/termux.properties.
# ---------------------------------------------------------------------------
