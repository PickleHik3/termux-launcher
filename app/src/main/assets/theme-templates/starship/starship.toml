# Launcher Material palettes for Starship
# Rendered by Termux Launcher - do not edit manually
# Active mode when this was rendered: {{ mode }}. A flip re-renders this file, which is what
# makes apply.sh run again and move the palette line.
#
# Both palettes are here, every time. apply.sh points starship at the one for
# the current mode with a single `palette = "launcher-material-<mode>"` line at
# the top of your starship.toml, and rewrites that line when the mode changes.
#
# Segment fills below are Material surface hex, so a pill keeps its exact
# wallpaper tint. Accents in a prompt are better written as ANSI names
# (`green`, `bright-blue`, ...): starship emits those as terminal colours, so
# they follow the terminal itself the instant it recolours, with no re-render.

[palettes.launcher-material-dark]
# Standard colors
blue      = "{{ colors.terminal_normal_blue.dark.hex }}"
red       = "{{ colors.terminal_normal_red.dark.hex }}"
green     = "{{ colors.terminal_normal_green.dark.hex }}"
yellow    = "{{ colors.terminal_normal_yellow.dark.hex }}"
cyan      = "{{ colors.terminal_normal_cyan.dark.hex }}"
magenta   = "{{ colors.terminal_normal_magenta.dark.hex }}"
white     = "{{ colors.terminal_normal_white.dark.hex }}"
black     = "{{ colors.terminal_normal_black.dark.hex }}"

# Extended palette (Catppuccin-compatible names some starship presets expect)
rosewater = "{{ colors.terminal_bright_yellow.dark.hex }}"
flamingo  = "{{ colors.terminal_bright_red.dark.hex }}"
pink      = "{{ colors.terminal_bright_magenta.dark.hex }}"
mauve     = "{{ colors.terminal_normal_magenta.dark.hex }}"
maroon    = "{{ colors.terminal_bright_red.dark.hex }}"
peach     = "{{ colors.terminal_bright_yellow.dark.hex }}"
teal      = "{{ colors.terminal_normal_cyan.dark.hex }}"
sky       = "{{ colors.terminal_bright_cyan.dark.hex }}"
sapphire  = "{{ colors.terminal_bright_blue.dark.hex }}"
lavender  = "{{ colors.terminal_bright_magenta.dark.hex }}"

# Text shades
text      = "{{ colors.terminal_foreground.dark.hex }}"
subtext1  = "{{ colors.terminal_normal_white.dark.hex }}"
subtext0  = "{{ colors.terminal_bright_black.dark.hex }}"

# Surface shades
overlay2  = "{{ colors.terminal_bright_black.dark.hex }}"
overlay1  = "{{ colors.terminal_bright_black.dark.hex }}"
overlay0  = "{{ colors.terminal_normal_black.dark.hex }}"
surface2  = "{{ colors.terminal_normal_black.dark.hex }}"
surface1  = "{{ colors.terminal_normal_black.dark.hex }}"
surface0  = "{{ colors.terminal_background.dark.hex }}"
base      = "{{ colors.terminal_background.dark.hex }}"
mantle    = "{{ colors.terminal_background.dark.hex }}"
crust     = "{{ colors.terminal_background.dark.hex }}"

# Material roles, under their own names. The shades above are what existing presets
# ask for; these are what the Material prompt below is drawn with.
