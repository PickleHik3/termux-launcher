# >>> Material prompt >>>
# A prompt drawn as Material pills, in the roles above. It is off by default so it
# never replaces a prompt you already have. To use it, copy these lines into your
# own starship.toml above this block, drop the leading "# " from each, and open a
# new shell.
#
# The pill fills are palette names (Material surface hex); the two prompt
# characters are ANSI names, so they recolour with the terminal itself.
#
# format = "$directory$git_branch$git_status$cmd_duration$line_break$character"
#
# [directory]
# format = "[](fg:primary_container)[$path]($style)[](fg:primary_container) "
# style = "fg:on_primary_container bg:primary_container"
# truncation_length = 3
# truncation_symbol = "…/"
#
# [git_branch]
# format = "[](fg:secondary_container)[$symbol$branch]($style)[](fg:secondary_container) "
# style = "fg:on_secondary_container bg:secondary_container"
#
# [git_status]
# format = "[](fg:tertiary_container)[$all_status$ahead_behind]($style)[](fg:tertiary_container) "
# style = "fg:on_tertiary_container bg:tertiary_container"
#
# [cmd_duration]
# format = "[](fg:surface_container_high)[ $duration]($style)[](fg:surface_container_high) "
# min_time = 500
# style = "fg:on_surface_variant bg:surface_container_high"
#
# [character]
# success_symbol = "[❯](bold green)"
# error_symbol = "[❯](bold red)"
# <<< Material prompt <<<
