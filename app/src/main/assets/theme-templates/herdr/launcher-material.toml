# launcher-material colours for herdr - rendered by Termux Launcher, do not edit.
#
# Both palettes, in the two subtables herdr layers on top of the shared
# [theme.custom] overrides when [theme] auto_switch is on: it picks the one
# matching the light/dark appearance the host terminal reports. apply.sh
# splices these into ~/.config/herdr/config.toml.

[theme.custom.dark]
accent        = "{{ colors.primary.dark.hex }}"
panel_bg      = "{{ colors.surface_container.dark.hex }}"
sidebar_bg    = "{{ colors.surface_container_low.dark.hex }}"
active_row_bg = "{{ colors.primary_container.dark.hex }}"
selection_bg  = "{{ colors.secondary_container.dark.hex }}"
surface0      = "{{ colors.surface_container_high.dark.hex }}"
surface1      = "{{ colors.surface_container_highest.dark.hex }}"
surface_dim   = "{{ colors.surface_dim.dark.hex }}"
overlay0      = "{{ colors.outline_variant.dark.hex }}"
overlay1      = "{{ colors.outline.dark.hex }}"
text          = "{{ colors.on_surface.dark.hex }}"
subtext0      = "{{ colors.on_surface_variant.dark.hex }}"
mauve         = "{{ colors.tertiary.dark.hex }}"
green         = "{{ colors.terminal_normal_green.dark.hex }}"
yellow        = "{{ colors.terminal_normal_yellow.dark.hex }}"
red           = "{{ colors.error.dark.hex }}"
blue          = "{{ colors.primary.dark.hex }}"
teal          = "{{ colors.terminal_normal_cyan.dark.hex }}"
peach         = "{{ colors.terminal_bright_yellow.dark.hex }}"

[theme.custom.light]
accent        = "{{ colors.primary.light.hex }}"
panel_bg      = "{{ colors.surface_container.light.hex }}"
sidebar_bg    = "{{ colors.surface_container_low.light.hex }}"
active_row_bg = "{{ colors.primary_container.light.hex }}"
selection_bg  = "{{ colors.secondary_container.light.hex }}"
surface0      = "{{ colors.surface_container_high.light.hex }}"
surface1      = "{{ colors.surface_container_highest.light.hex }}"
surface_dim   = "{{ colors.surface_dim.light.hex }}"
overlay0      = "{{ colors.outline_variant.light.hex }}"
overlay1      = "{{ colors.outline.light.hex }}"
text          = "{{ colors.on_surface.light.hex }}"
subtext0      = "{{ colors.on_surface_variant.light.hex }}"
mauve         = "{{ colors.tertiary.light.hex }}"
green         = "{{ colors.terminal_normal_green.light.hex }}"
yellow        = "{{ colors.terminal_normal_yellow.light.hex }}"
red           = "{{ colors.error.light.hex }}"
blue          = "{{ colors.primary.light.hex }}"
teal          = "{{ colors.terminal_normal_cyan.light.hex }}"
peach         = "{{ colors.terminal_bright_yellow.light.hex }}"
