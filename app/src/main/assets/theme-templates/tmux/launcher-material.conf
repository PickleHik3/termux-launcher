# Launcher Material colours for tmux
# Rendered by Termux Launcher - do not edit manually

set -g status-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g status-left-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}"
set -g status-right-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g window-status-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g window-status-current-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold"
set -g window-status-activity-style "bg={{colors.tertiary_container.default.hex}},fg={{colors.on_tertiary_container.default.hex}}"
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g message-style "bg={{colors.tertiary_container.default.hex}},fg={{colors.on_tertiary_container.default.hex}}"
set -g message-command-style "bg={{colors.secondary_container.default.hex}},fg={{colors.on_secondary_container.default.hex}}"
set -g mode-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}"
set -g clock-mode-colour "{{colors.primary.default.hex}}"
set -g display-panes-colour "{{colors.outline.default.hex}}"
set -g display-panes-active-colour "{{colors.primary.default.hex}}"
