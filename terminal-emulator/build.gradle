apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {

    lint {
        // Untranslated strings are a standing condition, not a defect: the app ships more strings
        // than any translation carries and Android falls back to the default resource. Baselining
        // this one would put the build back in the red on the next string anybody adds.
        disable 'MissingTranslation'
        // Everything else that was already here is recorded in the baseline rather than silenced,
        // so a new finding of any kind still fails the build.
        baseline = file('lint-baseline.xml')
    }
    namespace "com.termux.emulator"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            abiFilters 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

tasks.withType(Test) {
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
    ["termux.fuzz.seed", "termux.fuzz.cases", "termux.fuzz.maxBytes"].each { propertyName ->
        String propertyValue = System.getProperty(propertyName)
        if (propertyValue != null) systemProperty propertyName, propertyValue
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.0"
    testImplementation "junit:junit:4.13.2"
}

// Experimental libghostty-vt terminal core, only with -Pghostty=true: builds the pinned library and
// its JNI shim into build/ghostty/jniLibs for arm64-v8a and x86_64 (see ghostty/build-libghostty.sh).
// Other builds, armeabi-v7a and CI carry no native core and always use the Java one.
if ((project.findProperty('ghostty') ?: 'false').toString() == 'true') {
    def ghosttyScript = file('ghostty/build-libghostty.sh')
    def ghosttyJniLibs = layout.buildDirectory.dir('ghostty/jniLibs').get().asFile
    def ghosttyHostLib = layout.buildDirectory.dir('ghostty/host').get().asFile
    def ndkVersionName = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    def buildGhostty = tasks.register('buildGhostty', Exec) {
        inputs.files(ghosttyScript, file('ghostty/ghostty_jni.c'))
        outputs.dir(ghosttyJniLibs)
        environment 'NDK_VERSION', ndkVersionName
        commandLine 'bash', ghosttyScript.absolutePath, ghosttyJniLibs.absolutePath, 'arm64-v8a', 'x86_64'
    }
    android.sourceSets.main.jniLibs.srcDirs += ghosttyJniLibs
    tasks.named('preBuild') { dependsOn buildGhostty }

    // The same library for this machine, so JVM tests can drive the real thing.
    def buildGhosttyHost = tasks.register('buildGhosttyHost', Exec) {
        inputs.files(ghosttyScript, file('ghostty/ghostty_jni.c'))
        outputs.dir(ghosttyHostLib)
        commandLine 'bash', ghosttyScript.absolutePath, ghosttyHostLib.absolutePath, 'host'
    }
    tasks.withType(Test).configureEach {
        dependsOn buildGhosttyHost
        systemProperty 'termux.ghostty.libDir', new File(ghosttyHostLib, 'host').absolutePath
    }
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'terminal-emulator'
                version = '0.118.0'
                artifact(sourceJar)
            }
        }
    }
}
