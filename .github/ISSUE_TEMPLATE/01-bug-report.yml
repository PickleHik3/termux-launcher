name: "Bug report"
description: "Create a report to help us improve Termux Launcher"
title: "[Bug]: "
labels: ["bug report"]
body:
  - type: markdown
    attributes:
      value: |
        This is the bug tracker of **Termux Launcher**. If the problem is with a package installed inside the app, please report it to the package's own project instead.

        Use search before you open an issue to check whether your issue has been already reported and perhaps solved.

        Termux Launcher needs Android 8 (API 26) or newer.
  - type: textarea
    attributes:
      label: Problem description
      description: |
        A clear and concise description of what the problem is. You may attach logs, screenshots, a screen recording, or anything else that helps to understand the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        List everything needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is the expected behavior?
  - type: textarea
    attributes:
      label: System information
      description: Please provide info about your app and device.
      value: |
        * Termux Launcher version (Settings → About, or `echo $TERMUX_VERSION` in the terminal):
        * Edition (Termux / Nix / VAJ):
        * Nightly or release:
        * Android version:
        * Device model:
    validations:
      required: true
