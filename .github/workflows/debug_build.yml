name: Build nightly

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: >-
          staging is the usual nightly (debuggable, for run-as). release is the same code built
          as a published APK is: not debuggable, to compare speed on a tester's phone.
        type: choice
        options:
          - staging
          - release
        default: staging
  push:
    branches:
      - dev
      - pre


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Zig for the libghostty-vt terminal engine (-Pghostty=true)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        shell: bash {0}
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
          GRADLE_MAX_ATTEMPTS: "5"
          GRADLE_RETRY_SLEEP_SECONDS: "20"
          GRADLE_REFRESH_FROM_ATTEMPT: "2"
        run: |
          ./.github/scripts/gradle_retry.sh ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
          # Empty on a push: only a manual run can ask for a release build.
          BUILD_TYPE: ${{ inputs.build_type || 'staging' }}
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
          GRADLE_MAX_ATTEMPTS: "5"
          GRADLE_RETRY_SLEEP_SECONDS: "20"
          GRADLE_REFRESH_FROM_ATTEMPT: "2"
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              GITHUB_SHA="${{ github.event.pull_request.head.sha }}" # Do not use last merge commit set in GITHUB_SHA
          fi

          # A release build is signed with the repository's test key, as published APKs are
          # (attach_debug_apks_to_release.yml), so it installs over a nightly or a release, and
          # is split per ABI like a nightly. Its version says "rel" where a nightly says "dev".
          case "$BUILD_TYPE" in
            release)
              BUILD_TASK="assembleRelease"; VERSION_KIND="rel"
              export TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS="1"
              export TERMUX_RELEASE_STORE_FILE="$PWD/app/testkey_untrusted.jks"
              export TERMUX_RELEASE_STORE_PASSWORD="xrj45yWGLbsO7W0v"
              export TERMUX_RELEASE_KEY_ALIAS="alias"
              export TERMUX_RELEASE_KEY_PASSWORD="xrj45yWGLbsO7W0v"
              ;;
            staging) BUILD_TASK="assembleStaging"; VERSION_KIND="dev" ;;
            *) exit_on_error "Unknown build type '$BUILD_TYPE'." ;;
          esac

          # Nightly version = versionName + "+dev.<shortsha>" (semver build metadata, so it sorts
          # equal to the release it follows). Used verbatim in the app and in the APK name.
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NIGHTLY_VERSION_NAME="${CURRENT_VERSION_NAME%%+*}+${VERSION_KIND}.${SHORT_SHA}"
          if ! printf "%s" "$NIGHTLY_VERSION_NAME" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '$NIGHTLY_VERSION_NAME' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          # Edition from the applicationId of the checked-out branch.
          APPLICATION_ID="$(grep -m 1 -E '^\s+applicationId\s' ./app/build.gradle | sed -r 's/.*"([^"]+)".*/\1/' || true)"
          case "$APPLICATION_ID" in
            com.termux.launcher.nix) EDITION="nix" ;;
            io.vaj.tl) EDITION="vaj" ;;
            *) EDITION="termux" ;;
          esac

          APK_DIR_PATH="./app/build/outputs/apk/$BUILD_TYPE"
          # termux-app_v<versionName>_<edition>_<variant>_<abi>.apk, versionName verbatim (with the +)
          APK_VERSION_TAG="v${NIGHTLY_VERSION_NAME}_${EDITION}_${{ env.PACKAGE_VARIANT }}"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          # Used by attachment steps later
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV

          echo "Building APKs for 'APK_VERSION_TAG' build"
          export TERMUX_APP_VERSION_NAME="$NIGHTLY_VERSION_NAME" # Used by app/build.gradle
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}" # Used by app/build.gradle
          ./.github/scripts/gradle_retry.sh ./gradlew --no-daemon -Pghostty=true "$BUILD_TASK" || \
            exit_on_error "Build failed for '$APK_VERSION_TAG' build."

          echo "Validating APKs"
          for abi in universal arm64-v8a armeabi-v7a x86_64; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
            fi
          done

          echo "Generating sha25sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum \
            "${APK_BASENAME_PREFIX}_universal.apk" \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha25sums failed for '$APK_VERSION_TAG' release."
          fi

      - name: Attach universal APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_universal
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach arm64-v8a APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_arm64-v8a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach armeabi-v7a APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach x86_64 APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86_64
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86_64.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach sha256sums file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_sha256sums
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
            ${{ env.APK_DIR_PATH }}/output-metadata.json
