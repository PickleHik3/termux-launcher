name: Announce Release On Discord

# Posts a published release to the Discord server: a stable `vX.Y.Z` to #releases, a pre-release
# channel drop `vX.Y.Z-pre.N` to #pre-release. Every version ships three GitHub releases (plain,
# nix-, vaj-); only the plain tag posts, once, linking all three editions. Nightlies are workflow
# artifacts, not releases, so they never post. The tag name decides the channel, not GitHub's
# Pre-release flag (reserved for -pre drops since 1.0.4; the nix- stables before that carried it).
#
# Secrets: DISCORD_WEBHOOK_RELEASES, DISCORD_WEBHOOK_PRERELEASE (channel webhook URLs). A missing
# secret skips the post with a notice instead of failing the run.
#
# A pre-release pings the Testers role (members opt in through the server's Onboarding). Nothing
# else is ever pinged: allowed_mentions names that one role and parses nothing from the notes.
#
# The notes are tidied for Discord before posting: HTML comments (maintainer notes GitHub hides) are
# stripped, a first heading that only repeats the tag is dropped, headings are rescaled so the top
# level is ## (Discord renders # to ### only; deeper ones become bold lines), and #N links its issue.
# A manual run with edit_message_id re-renders an existing post in place, so nobody is pinged again.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing plain release tag to (re)announce, e.g. v1.0.3 or v1.1.0-pre.1'
        required: true
        type: string
      edit_message_id:
        description: 'Optional: ID of this tag''s existing Discord post, to edit it in place instead of posting again'
        required: false
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Untrusted text (tag, body) reaches the script only through the environment, never
          # interpolated into it.
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_BODY: ${{ github.event.release.body }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          EDIT_MESSAGE_ID: ${{ github.event.inputs.edit_message_id }}
          WEBHOOK_RELEASES: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          WEBHOOK_PRERELEASE: ${{ secrets.DISCORD_WEBHOOK_PRERELEASE }}
          # The server's Testers role (Discord role ID; not a secret).
          TESTERS_ROLE_ID: '1558766521663356980'
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, urllib.request

          repo = os.environ["REPO"]
          tag = os.environ.get("INPUT_TAG") or os.environ.get("EVENT_TAG") or ""
          body = os.environ.get("EVENT_BODY") or ""
          if os.environ.get("INPUT_TAG"):
              body = subprocess.run(["gh", "release", "view", tag, "-R", repo, "--json", "body",
                                     "--jq", ".body"], capture_output=True, text=True,
                                    check=True).stdout

          if re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              kind, hook, color = "release", os.environ.get("WEBHOOK_RELEASES"), 0x22C55E
          elif re.fullmatch(r"v\d+\.\d+\.\d+-pre\.\d+", tag):
              kind, hook, color = "pre-release", os.environ.get("WEBHOOK_PRERELEASE"), 0xF59E0B
          else:
              print(f"'{tag}' is not a plain stable or pre-release tag (edition tags post via the plain one); nothing to announce.")
              sys.exit(0)
          if not hook:
              print(f"::notice::No Discord webhook secret for {kind}s; skipping {tag}.")
              sys.exit(0)

          base = f"https://github.com/{repo}/releases/tag/"
          editions = (f"[Termux edition]({base}{tag}) · [Nix edition]({base}nix-{tag}) · "
                      f"[VAJ edition]({base}vaj-{tag})")
          note = ("APKs are attached to each release within a few minutes of this post."
                  if kind == "release" else
                  "⚠️ Pre-release: may break. Install only from these GitHub links, and back up "
                  "your home folder first. It installs over your current build.")

          def tidy(md):
              md = re.sub(r"<!--.*?-->", "", md, flags=re.S)
              lines = md.strip().splitlines()
              # The embed title already names the version.
              if lines and re.fullmatch(r"#+\s*" + re.escape(tag) + r"\s*", lines[0].strip()):
                  lines = lines[1:]
              # Headings outside code fences; a shell comment in a fence is not one.
              heading, fenced = [], False
              for line in lines:
                  if line.lstrip().startswith("```"):
                      fenced = not fenced
                  heading.append(None if fenced else re.match(r"(#+)\s+(.*)", line))
              levels = [len(m.group(1)) for m in heading if m]
              shift = min(levels) - 2 if levels else 0
              out = []
              for line, m in zip(lines, heading):
                  if m:
                      level = len(m.group(1)) - shift
                      line = "#" * level + " " + m.group(2) if level <= 3 else f"**{m.group(2)}**"
                  out.append(line)
              md = re.sub(r"\n{3,}", "\n\n", "\n".join(out)).strip()
              return re.sub(r"(?<![\w/&\[])#(\d+)\b",
                            lambda m: f"[#{m.group(1)}](https://github.com/{repo}/issues/{m.group(1)})", md)

          limit = 4096 - 400  # embed description cap, minus the links and note below
          text = tidy(body)
          if len(text) > limit:
              text = text[:limit].rsplit("\n", 1)[0] + "\n\n…full notes on GitHub."
          embed = {
              "title": f"Termux Launcher {tag}" + (" (pre-release)" if kind == "pre-release" else ""),
              "url": base + tag,
              "description": f"{text}\n\n**Download:** {editions}\n{note}",
              "color": color,
          }
          payload = {"username": "Termux Launcher releases", "embeds": [embed],
                     "allowed_mentions": {"parse": []}}  # release notes never ping anyone
          testers = os.environ.get("TESTERS_ROLE_ID", "")
          if kind == "pre-release" and testers.isdigit():
              payload["content"] = f"<@&{testers}> {tag} is out, test build below 👇"
              payload["allowed_mentions"] = {"parse": [], "roles": [testers]}
          edit_id = (os.environ.get("EDIT_MESSAGE_ID") or "").strip()
          if edit_id and not edit_id.isdigit():
              sys.exit(f"edit_message_id must be a Discord message ID, got '{edit_id}'")
          if edit_id:
              # A webhook can edit only its own messages; the name it posted under stays.
              payload.pop("username")
              url, method = f"{hook}/messages/{edit_id}", "PATCH"
          else:
              url, method = hook, "POST"
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), method=method,
                                       headers={"Content-Type": "application/json",
                                                "User-Agent": "termux-launcher-release-announcer"})
          with urllib.request.urlopen(req, timeout=20) as resp:
              verb = f"Re-rendered message {edit_id} for" if edit_id else "Announced"
              print(f"{verb} {tag} as a {kind}: HTTP {resp.status}")
          PY
