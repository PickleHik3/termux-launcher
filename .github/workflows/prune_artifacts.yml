# Artifact retention policy:
# - Keep the artifacts of the newest two workflow runs on each branch that still exists.
# - Delete every other artifact: older runs on live branches, and all artifacts from branches that no longer exist.
# - Expired artifacts are skipped (GitHub already dropped their files).
#
# This is housekeeping so the artifact list stays small, not a billing fix (the repository is public).
# One run deletes at most 900 artifacts, so a large backlog is spread over several pushes to dev.
name: Prune artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  actions: write
  contents: read

concurrency:
  group: prune-artifacts
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const KEEP_RUNS = 2;
            const MAX_DELETIONS = 900;
            const { owner, repo } = context.repo;

            const branches = new Set(
              (await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 }))
                .map((b) => b.name));
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 });
            const live = all.filter((a) => !a.expired);

            // Newest artifact time per run, per branch.
            const runsByBranch = new Map();
            for (const a of live) {
              const run = a.workflow_run;
              if (!run || !branches.has(run.head_branch)) continue;
              if (!runsByBranch.has(run.head_branch)) runsByBranch.set(run.head_branch, new Map());
              const runs = runsByBranch.get(run.head_branch);
              const t = Date.parse(a.created_at);
              if (!runs.has(run.id) || runs.get(run.id) < t) runs.set(run.id, t);
            }
            const keptRuns = new Set();
            for (const runs of runsByBranch.values()) {
              [...runs.entries()].sort((x, y) => y[1] - x[1]).slice(0, KEEP_RUNS)
                .forEach(([id]) => keptRuns.add(id));
            }

            const doomed = live.filter((a) => !(a.workflow_run && keptRuns.has(a.workflow_run.id)));
            const kept = live.length - doomed.length;
            let deleted = 0, failed = 0, bytes = 0;
            for (const a of doomed) {
              if (deleted >= MAX_DELETIONS) break;
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                deleted++;
                bytes += a.size_in_bytes;
                core.info(`deleted ${a.name}`);
              } catch (e) {
                failed++;
                core.warning(`could not delete ${a.name} (${a.id}): ${e.message}`);
              }
            }
            const left = doomed.length - deleted - failed;
            await core.summary
              .addHeading('Prune artifacts')
              .addTable([
                ['Kept', 'Deleted', 'Freed (MB)', 'Failed', 'Left for later pushes'],
                [kept, deleted, (bytes / 1048576).toFixed(1), failed, left].map(String),
              ])
              .write();
