# ~/.termux/fonts.conf — Maple Mono v7.9, variable-axis setup
#
# Text faces come from the variable pair (wght 100-800), so weight is an axis
# value rather than a separate file. Nerd Font glyphs come from the static NF
# build through symbol_map, because the variable build carries no icons.
# Apply changes with:  termux-reload-settings

## Faces --------------------------------------------------------------------
#
# Regular and bold share one file; italic and bold-italic share the other. The
# weight difference is produced by font_variations below, not by the file.

font_family      path=~/.termux/fonts/MapleMono[wght].ttf
bold_font        path=~/.termux/fonts/MapleMono[wght].ttf
italic_font      path=~/.termux/fonts/MapleMono-Italic[wght].ttf
bold_italic_font path=~/.termux/fonts/MapleMono-Italic[wght].ttf

# Static fallback — swap these four in if Android ever rejects the axis
# (the loader then reports "Android rejected the requested axes" and drops the
# variations, leaving every face at wght 400):
# font_family      path=~/.termux/fonts/MapleMono-NF-Regular.ttf
# bold_font        path=~/.termux/fonts/MapleMono-NF-Bold.ttf
# italic_font      path=~/.termux/fonts/MapleMono-NF-Italic.ttf
# bold_italic_font path=~/.termux/fonts/MapleMono-NF-BoldItalic.ttf


## Variable axes -------------------------------------------------------------
#
# wght accepts anything in 100-800, not just the named stops, so the text
# weight can be tuned against this panel: 380-420 for a lighter body, 600-650
# for a bold that is present without shouting.

font_variations regular     wght=400
font_variations bold        wght=700
font_variations italic      wght=400
font_variations bold_italic wght=700


## Symbol maps ---------------------------------------------------------------
#
# The variable build has no Nerd Font patch, so both private-use planes are
# routed to the static NF face: BMP PUA (powerline, devicons, codicons, seti,
# font-awesome) and SPUA-A (the material set). Symbol fonts never change the
# cell width, so the grid stays intact.

symbol_map U+E000-U+F8FF   path=~/.termux/fonts/MapleMono-NF-Regular.ttf
symbol_map U+F0000-U+FFFFD path=~/.termux/fonts/MapleMono-NF-Regular.ttf


## Ligatures -----------------------------------------------------------------
#
# Maple ships its programming ligatures in `calt`, which is what this policy
# switches off. `cursor` keeps -> => != === |> shaped while reading, and
# un-fuses only the run under the cursor so column counting stays honest.

disable_ligatures cursor


## OpenType features ---------------------------------------------------------
#
# `zero` selects Maple's alternate zero form; drop these lines for the default.
# Face-scoped, so each face is set separately. `symbols` targets the NF face.

font_features regular     +zero
font_features bold        +zero
font_features italic      +zero
font_features bold_italic +zero

# Other tags in this font, all off by default:
#   cv01  @ $ & % Q plainer forms      cv02  single-storey a
#   cv03  serifed i                    cv04  straight l / 1
#   cv31-cv44  alternate operators     cv61-cv66  alternate , ; ?
#   ss01  break == === !=              ss02  break <= >=
#   ss03  thin escape backslash        ss05-ss11  further ligature breakers


## Cell and decoration metrics ------------------------------------------------
#
# Maple ships line_height 1.0, so nothing is adjusted. Knobs if the grid needs
# tuning:
# modify_font cell_height 2px
# modify_font underline_position 1px
# modify_font underline_thickness 125%
