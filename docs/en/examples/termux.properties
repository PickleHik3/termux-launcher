### Termux Launcher extension: an extra key can run any registry action with
### `tool:<action-id>[:arg=value...]`. Discover ids in the command palette
### (Ctrl+Alt+Shift+P). This default row showcases workspaces, window
### switching, pane layouts, the scratchpad, and floating panes.
### Full Extra Keys guide:
### https://picklehik3.github.io/termux-launcher-site/#wiki/extra-keys
### Complete action and argument reference:
### https://picklehik3.github.io/termux-launcher-site/#wiki/action-reference
extra-keys = [[ \
  {key: KEYBOARD, display: "⌨", popup: PASTE}, \
  {key: "tool:workspace.picker", display: "⊞↑"}, \
  {key: "tool:workspace.save_prompt", display: "⊞↓"}, \
  {key: "tool:window.previous", display: "‹", popup: {key: "tool:session.previous", display: "«"}}, \
  {key: "tool:window.next", display: "›", popup: {key: "tool:session.next", display: "»"}}, \
  {key: "tool:pane.move_to_edge:edge=left", display: "⇤", popup: {key: "tool:pane.next_layout", display: "▦↻"}}, \
  {key: "tool:terminal.toggle_scratchpad", display: "✎", popup: {key: "tool:pane.toggle_float", display: "▣"}} \
]]
###############
# Colors/themes
###############

### Force black colors for drawer and dialogs
# use-black-ui = true

###############
# HW keyboard shortcuts
###############

### Disable hardware keyboard shortcuts.
# disable-hardware-keyboard-shortcuts = true

### Open a new terminal with ctrl + t (volume down + t)
# shortcut.create-session = ctrl + t

### Go one session down with (for example) ctrl + 2
# shortcut.next-session = ctrl + 2

### Go one session up with (for example) ctrl + 1
# shortcut.previous-session = ctrl + 1

### Rename a session with (for example) ctrl + n
# shortcut.rename-session = ctrl + n

###############
# Bell key
###############

### Vibrate device (default).
# bell-character = vibrate

### Beep with a sound.
# bell-character = beep

### Ignore bell character.
# bell-character = ignore

###############
# Back key
###############

### Send the Escape key.
back-key=escape

### Hide keyboard or leave app (default).
# back-key=back

###############
# Keyboard issue workarounds
###############

### Letters might not appear until enter is pressed on Samsung devices
# enforce-char-based-input = true

### ctrl+space (for marking text in emacs) does not work on some devices
# ctrl-space-workaround = true

###############
# Terminal Margin adjustments
###############

### Horizontal (left/right) Margin
terminal-margin-horizontal=0
terminal-margin-vertical=0

### Vertical (top/bottom) Margin
# terminal-margin-vertical=0
background-overlay-color=#211A110F
night-mode=system
fullscreen=false
