<!doctype html>
<!--
  Open Design · OD Next handheld shell — Android (centered punch-hole camera, right-side volume and power keys).
  Presentation shell for a phone-app prototype: keep the handset markup and
  CSS, put the product inside the APP CONTENT slot (`.phone-content`). The
  shell sets no typography, palette, spacing, or navigation for the app.
  Derived from the Open Design mobile-app template (Apache-2.0).

  Product: Termux Launcher v2, Appearance editor. One card anatomy, ten cards,
  one set of transition rules. Spec: SPEC.md beside this file.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Termux Launcher: Appearance editor cards</title>
  <style>
    /* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
       Put this @layer first; product CSS outside the layer wins ordinary layout rules.
       Native hidden and closed-dialog states take precedence over component display rules. */
    @layer od-layout {
      [hidden]:not([hidden="until-found" i]) { display: none !important; }
      dialog:not([open]) { display: none !important; }

      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

      .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
      .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
      .od-fill    { flex: 1 1 0; min-width: 0; }
      .od-fixed   { flex: none; }
      .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

      .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
      :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
      .od-tile { display: grid; grid-template-rows: auto 1fr; }
      :where(.od-tile) > :where(*) { display: block; }

      .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
      .od-media-cover { object-fit: cover; }

      .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

      .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .od-clamp-2 { -webkit-line-clamp: 2; }
      .od-clamp-3 { -webkit-line-clamp: 3; }
      .od-lines-2 { min-height: calc(2 * 1.4em); }
      .od-nowrap  { white-space: nowrap; }
      .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

      .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
      .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

      .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
                 padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
      .od-rail::-webkit-scrollbar { display: none; }
      :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
      :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

      .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
      .od-touch  { min-width: 44px; min-height: 44px; }
    }
    :root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
    /* /OD-LAYOUT-PRIMITIVES v1 */
  </style>
  <style>
    /* Native hidden remains authoritative over component flex/grid styles. */
    [hidden]:not([hidden="until-found" i]) { display: none !important; }

    :root {
      --phone-screen-width: 412px;
      --phone-screen-height: 915px;
      --phone-bezel: 10px;
      --phone-outer-radius: 46px;
      --phone-screen-radius: 38px;
      --phone-safe-top: 52px;
      --phone-safe-bottom: 28px;
      --phone-system-fg: #e8edf7;
      --phone-screen-bg: #0f141b;
      --phone-stage-bg: #e8eaee;
    }
    :root[data-theme="light"] { --phone-system-fg: #17181a; --phone-screen-bg: #f4f6fb; }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.95), transparent 36%),
        var(--phone-stage-bg, #e8eaee);
      color: #191a1d;
      font-family: Roboto, "Noto Sans", system-ui, sans-serif;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width, 412px) + var(--phone-bezel, 10px) * 2);
      height: calc(var(--phone-screen-height, 915px) + var(--phone-bezel, 10px) * 2);
      padding: var(--phone-bezel, 10px);
      border-radius: var(--phone-outer-radius, 46px);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 18%),
        linear-gradient(155deg, #414348 0%, #23252a 44%, #0c0d10 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.84),
        0 34px 72px -22px rgba(8,10,14,.56),
        0 11px 25px -10px rgba(8,10,14,.34);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 92px;
      bottom: 92px;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.14) 18%, transparent 32%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }

    .hardware-button {
      position: absolute;
      right: -3px;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2d3036 62%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.1);
    }
    .hardware-button.volume { top: 205px; height: 92px; }
    .hardware-button.power { top: 322px; height: 70px; background: linear-gradient(90deg, #08090b, #3c424c 62%, #08090b); }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width, 412px);
      height: var(--phone-screen-height, 915px);
      overflow: hidden;
      border-radius: var(--phone-screen-radius, 38px);
      background: var(--phone-screen-bg, #f6f7f9);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top, 52px);
      padding-bottom: var(--phone-safe-bottom, 28px);
      background: var(--phone-screen-bg, #f6f7f9);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .punch-hole {
      position: absolute;
      z-index: 20;
      top: 14px;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #283343 0 10%, #090b0f 30%, #000 72%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), inset 0 0 3px #000;
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      inset: 0 0 auto;
      height: var(--phone-safe-top, 52px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr);
      align-items: start;
      padding: 14px 19px 0;
      color: var(--phone-system-fg, #17181a);
      pointer-events: none;
    }
    .status-time {
      justify-self: start;
      display: flex;
      align-items: center;
      height: 16px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .01em;
    }
    .status-cutout-zone { width: 64px; }
    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      height: 16px;
      gap: 5px;
    }
    .status-icons svg { display: block; flex: none; fill: currentColor; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .cellular { width: 14px; height: 12px; }
    .status-icons .battery { width: 9px; height: 14px; }

    .gesture-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 108px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--phone-system-fg, #17181a);
      opacity: .86;
      pointer-events: none;
    }

    /* Presentation scaling: keep the whole handset visible on short viewports. */
    @media (max-height: 998px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 904px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 829px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 754px) { .phone-frame { zoom: 0.66; } }
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }
  </style>

  <style>
    /* ═══ Design system: Termux Launcher v2 — tokens.css :root, light and pong-blue blocks (values only) ═══ */
    :root {
      --bg:           #0F141B;
      --surface:      #171D26;
      --surface-warm: #202837;
      --fg:    #E8EDF7;
      --fg-2:  #D9E2FF;
      --muted: #A9B4C5;
      --meta:  #C2CAD9;
      --border:      #404B5D;
      --border-soft: #2A3343;
      --accent:        #B8C7FF;
      --accent-on:     #08204F;
      --accent-hover:  color-mix(in oklab, var(--accent), white 8%);
      --accent-active: #D9E2FF;
      --success: #7FD69B;
      --warn:    #F0B48A;
      --danger:  #FFB4AB;

      --font-display: Roboto, "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-body:    Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono:    "Maple Mono", "Symbols Nerd Font Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;

      --text-xs:   11px;
      --text-sm:   12px;
      --text-base: 16px;
      --text-lg:   18px;
      --text-xl:   22px;
      --text-2xl:  28px;
      --text-3xl:  34px;
      --text-4xl:  48px;
      --leading-body:  1.5;
      --leading-tight: 1.15;
      --tracking-display: -0.02em;

      --space-1:  4px;
      --space-2:  8px;
      --space-3:  12px;
      --space-4:  16px;
      --space-5:  20px;
      --space-6:  24px;
      --space-8:  32px;
      --space-12: 48px;

      --radius-sm:   11px;
      --radius-md:   20px;
      --radius-lg:   24px;
      --radius-pill: 9999px;

      --elev-flat:   none;
      --elev-ring:   0 0 0 1px var(--border);
      --elev-raised: 0 6px 20px rgba(0, 0, 0, 0.35);
      --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 70%);

      --motion-fast:   170ms;
      --motion-base:   220ms;
      --ease-standard: cubic-bezier(0.3, 0.2, 0.05, 1);

      --container-max: 412px;

      --tl-glass-blur:     8px;
      --tl-glass-opacity:  0.34;
      --tl-glass-grain:    0.18;
      --tl-glass-fill:     color-mix(in srgb, var(--surface-warm) 34%, transparent);
      --tl-glass-rim:      rgba(255, 255, 255, 0.18);
      --tl-glass-vibrancy: 1;

      --tl-side-gap:      12px;
      --tl-pane-gap:      4px;
      --tl-status-height: 32px;
      --tl-dock-height:   36px;
      --tl-icon:          54px;
      --tl-extra-keys-row: 40px;
      --tl-keyboard-row:  52px;
      --tl-key-radius:    10.8px;
      --tl-key-gap:       3px;
      --tl-key-opacity:   0.71;
      --tl-touch-target:  48px;
      --tl-glyph:         24px;
      --tl-chip-height:   40px;
      --tl-segment-radius: 20px;
      --tl-segment-inner-radius: 8px;
      --tl-segment-gap:   2px;
      --tl-slider-track:  28px;
      --tl-slider-thumb:  4px;
      --tl-slider-length: 120px;
      --tl-place-display: #F0B48A;

      --tl-motion-exit:   110ms;
      --tl-ease-in:       cubic-bezier(0.4, 0, 0.2, 1);
      --tl-ease-out:      cubic-bezier(0.4, 0, 1, 1);

      --md-sys-color-primary-container:      #29477A;
      --md-sys-color-on-primary-container:   var(--fg-2);
      --md-sys-color-secondary-container:    #29477A;
      --md-sys-color-on-secondary-container: #D9E2FF;
      --md-sys-color-tertiary-container:     #4A3780;
      --md-sys-color-on-tertiary-container:  #EADDFF;
    }
    :root[data-theme="light"] {
      --bg:           #F4F6FB;
      --surface:      #EAEFF7;
      --surface-warm: #E1E7F2;
      --fg:    #171C24;
      --fg-2:  #0B1F44;
      --muted: #586171;
      --meta:  #556070;
      --border:      #C1C9D6;
      --border-soft: #D7DFEC;
      --accent:        #345CA8;
      --accent-on:     #FFFFFF;
      --accent-active: #D8E3FF;
      --success: #1B6B3A;
      --warn:    #8D4E19;
      --danger:  #BA1A1A;
      --elev-raised: 0 6px 20px rgba(23, 28, 36, 0.18);
      --tl-glass-fill: color-mix(in srgb, var(--surface) 34%, transparent);
      --tl-glass-rim:  rgba(255, 255, 255, 0.45);
      --tl-place-display: #8D4E19;
      --md-sys-color-primary-container:      #D8E3FF;
      --md-sys-color-secondary-container:    #D8E3FF;
      --md-sys-color-on-secondary-container: #0B1F44;
      --md-sys-color-tertiary-container:     #E8DEF8;
      --md-sys-color-on-tertiary-container:  #4F378B;
    }
    :root[data-scheme="pong-blue"] {
      --bg:           #0e141c;
      --surface:      #171c24;
      --surface-warm: #252a33;
      --border-soft:  #30353e;
      --fg:           #e8edf7;
      --fg-2:         #d5e3ff;
      --muted:        #c0c7d5;
      --meta:         #c0c7d5;
      --border:       #434750;
      --accent:       #a6c8ff;
      --accent-on:    #003060;
      --accent-active:#004787;
      --md-sys-color-primary-container:      #004787;
      --md-sys-color-secondary-container:    #3e4565;
      --md-sys-color-on-secondary-container: #dae2fd;
      --tl-glass-fill: color-mix(in srgb, #252a33 34%, transparent);
    }
    :root[data-theme="light"][data-scheme="pong-blue"] {
      --bg:           #f9f9ff;
      --surface:      #f0f3ff;
      --surface-warm: #e4e8f4;
      --border-soft:  #ffffff;
      --fg:           #171c24;
      --fg-2:         #001d36;
      --muted:        #434750;
      --meta:         #535f70;
      --border:       #c3c6cf;
      --accent:       #005eb1;
      --accent-on:    #ffffff;
      --accent-active:#d5e3ff;
      --md-sys-color-primary-container:      #d5e3ff;
      --md-sys-color-secondary-container:    #dce1ff;
      --md-sys-color-on-secondary-container: #151b2c;
      --tl-glass-fill: color-mix(in srgb, #f0f3ff 34%, transparent);
    }

    /* ═══ Prototype extensions (inferred; listed in SPEC.md) ═══ */
    :root {
      --tl-tertiary: #CFBCFF;                         /* inferred: tertiary ink tone 80; element-cell dot, Tertiary tint */
      --tl-rim-bright: rgba(255, 255, 255, 0.45);     /* inferred: Rim "Bright" */
      --dot-eop: var(--accent);                       /* element on page: primary (blue) */
      --dot-pg:  var(--warn);                         /* page: place ink (amber) */
      --dot-el:  var(--tl-tertiary);                  /* element: tertiary (violet) */
      --wp-blue: radial-gradient(120% 80% at 20% 0%, color-mix(in oklab, var(--accent), transparent 40%), transparent 60%), linear-gradient(165deg, #1b6ad6 0%, #0b3b8c 55%, #04213f 100%);
      --wp-dusk: radial-gradient(110% 70% at 80% 0%, #c98aa8 0%, transparent 60%), linear-gradient(170deg, #4b3a78 0%, #6d3f6b 50%, #1c1430 100%);
      --wp-moss: radial-gradient(110% 70% at 10% 0%, #5aa07a 0%, transparent 60%), linear-gradient(160deg, #1f4d3a 0%, #173a2c 55%, #0b1d16 100%);
      --wp-graphite: radial-gradient(110% 70% at 50% 0%, #5b6270 0%, transparent 60%), linear-gradient(170deg, #343841 0%, #1c1f24 60%, #0d0f12 100%);
      --wp-accent-blue: #a6c8ff;
      --wp-accent-dusk: #ffb1c8;
      --wp-accent-moss: #9fd4b0;
      --wp-accent-graphite: #c4c7cf;
      --fx-colour: var(--motion-fast) var(--tl-ease-in); /* colour state changes: 170 ms, alpha-in curve */
    }
    :root[data-theme="light"] { --tl-tertiary: #65558F; --tl-rim-bright: rgba(255, 255, 255, 0.75); }

    /* ═══ Stage (outside the phone) ═══ */
    .stage {
      position: fixed; left: 24px; top: 24px; z-index: 30;
      display: grid; gap: 8px; max-width: 240px;
      font: 14px/1.4 system-ui, sans-serif;
    }
    .stage p { margin: 0; }
    .stage-title { font-weight: 600; }
    .stage label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    .stage-hint { opacity: 0.75; }
    @media (max-width: 900px) { .stage { display: none; } }

    /* ═══ App ═══ */
    .app {
      position: absolute; inset: 0; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: var(--text-base); line-height: var(--leading-body);
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .app button { font: inherit; color: inherit; }
    .app :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ─── Launcher (the frame shows it at scale s) ─── */
    .launcher {
      position: absolute; left: 0; top: 0; z-index: 1;
      width: var(--W); height: var(--H);
      transform-origin: 0 0; overflow: hidden; touch-action: none;
      background: var(--bg);
    }
    .launcher:focus-visible { outline: 6px solid var(--accent); outline-offset: -6px; }
    .pages { position: absolute; left: 0; top: 0; height: 100%; width: calc(var(--W) * 2); display: flex; will-change: transform; }
    .page {
      position: relative; flex: none; width: var(--W); height: var(--H); overflow: hidden;
      --g-blur: 8px; --g-op: .34; --g-tint: 0; --g-col: var(--accent); --g-rad: 24px;
      --g-depth: .22; --g-edge: .2; --g-grain: .18; --g-rim: var(--tl-glass-rim);
      --c-primary: var(--accent); --c-secondary: var(--meta); --c-tertiary: var(--tl-tertiary);
      --wp: var(--wp-blue); --wp-dim: 0; --wp-blur: 0px;
      --icon: 54px; --dock-h: 36px; --dock-m: 8px; --icons-bottom: 37px; --dock-space: 139px;
      --bar-h: 32px; --pill-space: 96px; --pill-bottom-space: 0px;
    }
    .wpl { position: absolute; inset: -32px; background: var(--wp); filter: blur(var(--wp-blur)); }
    .wpdim { position: absolute; inset: 0; background: black; opacity: var(--wp-dim); pointer-events: none; }

    /* Glass: the Base Look; every number is a per-surface variable the cards write */
    .g, .dock[data-design="beads"] .bead {
      position: relative;
      background: color-mix(in srgb, color-mix(in srgb, var(--g-col) calc(var(--g-tint) * 100%), var(--surface-warm)) calc(var(--g-op) * 100%), transparent);
      -webkit-backdrop-filter: blur(var(--g-blur)) saturate(calc(100% * var(--tl-glass-vibrancy)));
      backdrop-filter: blur(var(--g-blur)) saturate(calc(100% * var(--tl-glass-vibrancy)));
      box-shadow:
        inset 0 0 0 1px var(--g-rim),
        inset 0 calc(1px + var(--g-depth) * 8px) calc(var(--g-depth) * 16px) calc(var(--g-depth) * -8px) rgb(255 255 255 / var(--g-edge));
      border-radius: var(--g-rad);
    }
    .g::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      opacity: var(--g-grain);
      background-image: repeating-radial-gradient(circle at 0 0, transparent 0, transparent 1px, color-mix(in srgb, var(--fg) 12%, transparent) 1.5px, transparent 2px);
      background-size: 5px 5px; mix-blend-mode: overlay;
    }
    .app[data-mode="editor"] [data-surface] { cursor: pointer; }
    .app[data-mode="editor"] [data-surface]::before { content: ""; position: absolute; inset: -16px; }
    [data-surface]:focus-visible { outline: 4px solid var(--accent); outline-offset: 6px; }

    /* Status pill */
    .pill {
      position: absolute; left: var(--tl-side-gap); right: var(--tl-side-gap);
      top: calc(var(--phone-safe-top) + 4px); height: var(--bar-h);
      display: flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-2);
      font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1; color: var(--meta);
    }
    .pill[data-pos="floating"] { left: 40px; right: 40px; top: calc(var(--phone-safe-top) + 12px); }
    .pill[data-pos="bottom"] { top: auto; bottom: calc(var(--dock-space) + 4px); }
    .pill-time { color: var(--fg); display: inline-flex; align-items: center; padding-right: var(--space-1); }
    .face { display: none; }
    .pill[data-face="digits"] .face-digits, .pill[data-face="flip"] .face-flip { display: inline-flex; }
    .pill[data-face="analog"] .face-analog { display: block; }
    .face-flip { gap: 2px; }
    .face-flip b { font-weight: 500; padding: 2px 3px; border-radius: 4px; background: color-mix(in srgb, var(--fg) 14%, transparent); }
    .pill-badge { width: 20px; height: 20px; border-radius: var(--radius-pill); display: grid; place-items: center; background: color-mix(in srgb, var(--surface-warm) 60%, transparent); color: var(--fg); flex: none; }
    .wchip { height: 20px; padding: 0 var(--space-2); border-radius: var(--radius-pill); box-shadow: inset 0 0 0 1px var(--meta); display: inline-flex; align-items: center; white-space: nowrap; }
    .wchip[data-current] { background: var(--fg); color: var(--bg); box-shadow: none; }
    .pill-add { padding: 0 var(--space-1); }
    .pill-metrics { margin-left: auto; display: flex; gap: var(--space-2); white-space: nowrap; }
    .pill-metrics span + span::before { content: "•"; margin-right: var(--space-2); opacity: 0.6; }

    /* Home: widget, app grid */
    .widget {
      position: absolute; left: var(--tl-side-gap); right: var(--tl-side-gap);
      top: calc(var(--pill-space) + 8px); height: 168px; padding: var(--w-pad, 16px);
      display: grid; place-content: center; justify-items: center; gap: var(--space-2);
    }
    .flip { display: flex; gap: var(--space-2); }
    .flip b {
      font-family: var(--font-display); font-size: var(--text-4xl); font-weight: 500; letter-spacing: var(--tracking-display);
      line-height: 1; padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--surface) 55%, transparent); color: var(--fg);
    }
    .wdate { margin: 0; font-size: var(--text-sm); color: var(--fg); opacity: 0.85; }
    .widget-label { margin: 0; position: absolute; left: 0; right: 0; top: calc(var(--pill-space) + 182px); text-align: center; font-size: var(--text-sm); color: var(--fg); }
    .appgrid {
      position: absolute; left: var(--tl-side-gap); right: var(--tl-side-gap); top: calc(var(--pill-space) + 216px);
      display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); row-gap: var(--space-6); justify-items: center;
    }
    .appgrid[data-cols="4"] { --cols: 4; }
    .appgrid[data-cols="5"] { --cols: 5; }
    .appgrid[data-cols="4"] .tile:nth-child(n+9) { display: none; }
    .appgrid[data-cols="5"] .tile { --icon: 48px; }
    .tile {
      width: var(--icon); height: var(--icon); border-radius: var(--radius-pill);
      display: grid; place-items: center; background: var(--fg); color: var(--accent-on);
      --od-icon-size: calc(var(--icon) * 0.44);
    }
    .ldots { position: absolute; left: 0; right: 0; bottom: calc(var(--dock-space) - 18px); display: flex; justify-content: center; gap: var(--space-2); }
    .ldots i { width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--fg); opacity: 0.45; }
    .ldots i.on { opacity: 1; }

    /* Dock */
    .dock { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--dock-space) - 24px); }
    .band { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--phone-safe-bottom) + var(--dock-h)); border-radius: var(--g-rad) var(--g-rad) 0 0; }
    .dock[data-style="floating"] .band {
      left: calc(var(--tl-side-gap) + var(--dock-m)); right: calc(var(--tl-side-gap) + var(--dock-m));
      bottom: calc(var(--phone-safe-bottom) + var(--dock-m)); height: var(--dock-h); border-radius: var(--g-rad);
    }
    .dock[data-design="strip"] .band { height: calc(var(--phone-safe-bottom) + 10px); }
    .dock[data-design="strip"][data-style="floating"] .band { height: 10px; }
    .dock[data-design="beads"] .band { display: none; }
    .dock-icons { position: absolute; left: 16px; right: 16px; bottom: var(--icons-bottom); display: flex; justify-content: space-around; align-items: center; }
    .bead { width: calc(var(--icon) + 8px); height: calc(var(--icon) + 8px); border-radius: var(--radius-pill); display: grid; place-items: center; }
    .dock[data-design="beads"] .bead { border-radius: var(--radius-pill); }

    /* Terminal page */
    .term-layout {
      position: absolute; left: var(--tl-side-gap); right: var(--tl-side-gap);
      top: var(--pill-space); bottom: calc(var(--dock-space) + var(--pill-bottom-space));
      display: flex; flex-direction: column; gap: var(--space-2);
    }
    .panes { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--pane-gap, 4px); }
    .pane {
      flex: 3; min-height: 0; overflow: hidden; padding: var(--space-3);
      font-family: var(--font-mono); font-size: var(--term-fs, 12px); line-height: 1.5; white-space: pre; color: var(--fg);
    }
    .pane + .pane { flex: 2; }
    .pane .pr { color: var(--c-primary); }
    .pane .mu { color: var(--muted); }
    .pane .cur, .pane .trail i { display: inline-block; width: 0.6em; height: 1.15em; vertical-align: text-bottom; background: var(--fg); }
    .pane .trail i:nth-child(1) { opacity: 0.1; } .pane .trail i:nth-child(2) { opacity: 0.18; }
    .pane .trail i:nth-child(3) { opacity: 0.28; } .pane .trail i:nth-child(4) { opacity: 0.42; }
    .panes[data-trail="none"] .trail i { display: none; }
    .panes[data-trail="short"] .trail i:nth-child(-n+2) { display: none; }
    .panes[data-fx="scanlines"] .pane::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: repeating-linear-gradient(to bottom, color-mix(in srgb, var(--fg) 7%, transparent) 0 1px, transparent 1px 3px);
    }
    .panes[data-fx="glow"] .pane { text-shadow: 0 0 6px color-mix(in srgb, var(--c-primary) 70%, transparent); }

    .kb-group { position: relative; flex: none; display: grid; gap: var(--space-2); --split: 0%; }
    .kb-group[data-kb="split"] { --split: 12%; }
    .xkeys { height: var(--tl-extra-keys-row); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: center; color: var(--fg); --od-icon-size: 22px; }
    .xkeys > span { display: grid; place-items: center; }
    .xk-primary { color: var(--c-primary); }
    .xk-secondary { color: var(--c-secondary); }
    .xk-tertiary { color: var(--tl-place-display); }
    .keyboard { display: grid; gap: var(--tl-key-gap); padding: var(--space-2); }
    .kb-group[data-kb="floating"] .keyboard { width: 90%; justify-self: center; }
    .krow { display: flex; gap: var(--tl-key-gap); height: var(--tl-keyboard-row); }
    .key {
      position: relative; flex: var(--kw, 1) 1 0; min-width: 0;
      border-radius: var(--key-rad, 10.8px);
      background: color-mix(in srgb, var(--surface) calc(var(--key-op, .71) * 100%), transparent);
      color: var(--fg); font-size: var(--text-xl); display: grid; place-items: center;
    }
    .key--mod { font-size: var(--text-base); color: var(--muted); }
    .key--accent { background: var(--accent); color: var(--accent-on); }
    .ksp { flex: var(--kw, 0.5) 1 0; }
    .ksplit { flex: 0 0 var(--split); }
    .kc { position: absolute; font-size: var(--text-xs); color: var(--muted); line-height: 1; font-style: normal; }
    .kc.ne { top: 4px; right: 6px; } .kc.sw { bottom: 4px; left: 6px; }

    /* ─── Frame ring, frame label, editor bar ─── */
    .ring { position: absolute; left: 0; top: 0; width: var(--W); height: var(--H); z-index: 2; pointer-events: none; opacity: 0; overflow: visible; }
    .ring .under { stroke: color-mix(in srgb, var(--bg) 70%, transparent); stroke-width: 4; fill: none; }
    .ring .over { stroke: var(--accent); stroke-width: 2; fill: none; }
    .flabel {
      position: absolute; left: 0; right: 0; height: 24px; z-index: 2;
      display: flex; justify-content: center; align-items: center; gap: var(--space-2);
      font-size: var(--text-sm); color: var(--muted); line-height: 1;
    }
    .flabel-name { white-space: nowrap; }
    .fdots { display: inline-flex; gap: var(--space-1); }
    .fdots i { width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--muted); opacity: 0.4; }
    .fdots i.on { opacity: 1; }
    .ebar {
      position: absolute; left: var(--tl-side-gap); right: var(--tl-side-gap); height: var(--tl-touch-target); z-index: 3;
      display: flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-1);
      border-radius: var(--radius-pill);
      background: var(--tl-glass-fill);
      -webkit-backdrop-filter: blur(var(--tl-glass-blur)); backdrop-filter: blur(var(--tl-glass-blur));
      box-shadow: inset 0 0 0 1px var(--tl-glass-rim);
    }
    .eb {
      flex: 0 1 auto; min-width: 0; height: 40px; padding: 0 var(--space-3);
      border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--fg); cursor: pointer;
      font-size: var(--text-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background-color var(--fx-colour), color var(--fx-colour);
    }
    .eb[aria-pressed="true"] { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .eb-done { margin-left: auto; flex: none; padding: 0 var(--space-5); background: var(--accent); color: var(--accent-on); font-weight: 500; }
    @media (hover: hover) { .eb-done:hover { background: var(--accent-hover); } }
    .eb-done:active { background: var(--accent-active); color: var(--md-sys-color-on-primary-container); }

    /* ─── Card sheet (one anatomy for all ten cards) ─── */
    .sheet {
      position: absolute; left: 0; right: 0; z-index: 4;
      display: grid; grid-template-rows: auto auto minmax(0, 1fr);
      background: var(--surface); color: var(--fg);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--elev-raised);
      will-change: transform;
    }
    .wpage { z-index: 5; }
    .sheet-head { touch-action: none; cursor: grab; }
    .sheet-head.static { cursor: default; }
    .handle-zone { display: grid; place-items: center; width: 100%; height: 24px; padding: 0; border: 0; background: transparent; cursor: inherit; }
    .handle { width: 32px; height: 4px; border-radius: var(--radius-pill); background: var(--muted); }
    .handle-space { height: 24px; }
    .title-row { display: flex; align-items: center; height: var(--tl-touch-target); padding: 0 var(--space-1) 0 var(--space-4); }
    .title-row.back-row { padding-left: var(--space-1); }
    .title-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-4); }
    .title-glyph { display: grid; place-items: center; --od-icon-size: var(--tl-glyph); }
    .title {
      margin: 0; min-width: 0; font-family: var(--font-display); font-size: var(--text-xl); font-weight: 500;
      line-height: var(--leading-tight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .icon-btn {
      flex: none; width: var(--tl-touch-target); height: var(--tl-touch-target); border: 0; border-radius: var(--radius-pill);
      display: grid; place-items: center; background: transparent; color: var(--fg); cursor: pointer; --od-icon-size: var(--tl-glyph);
    }
    .back-row .title-wrap { padding-left: var(--space-1); }
    .chips { display: flex; gap: var(--space-2); padding: var(--space-1) var(--space-4) var(--space-3); min-width: 0; }
    .chip {
      flex: 0 1 auto; min-width: 0; max-width: calc(50% - 4px); height: var(--tl-chip-height);
      display: inline-flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3) 0 var(--space-2);
      border: 1px solid var(--border); border-radius: var(--radius-pill); background: transparent; color: var(--fg); cursor: pointer;
      font-size: var(--text-sm); font-weight: 500; line-height: 1; --od-icon-size: 18px;
      transition: background-color var(--fx-colour), color var(--fx-colour), border-color var(--fx-colour);
    }
    .chip-in { display: inline-flex; align-items: center; gap: var(--space-2); min-width: 0; }
    .chip-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .chip[data-narrow="true"] { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-color: transparent; }
    .chip[aria-disabled="true"] { cursor: default; }
    .sheet-body { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 0 var(--space-4) calc(var(--phone-safe-bottom) + var(--space-4)); scrollbar-width: none; }
    .sheet-body::-webkit-scrollbar { display: none; }
    .rows { display: grid; }

    .row { display: flex; align-items: center; gap: var(--space-4); min-height: 56px; }
    .row.stacked { display: grid; gap: var(--space-2); padding: var(--space-2) 0; align-items: stretch; }
    .row-name {
      display: inline-flex; align-items: center; gap: 6px; min-width: 0; border-radius: var(--space-2);
      font-size: var(--text-base); line-height: var(--leading-tight); color: var(--fg); cursor: default;
    }
    .row > .row-name { flex: 0 0 104px; }
    .row.stacked > .row-name { justify-self: start; max-width: 100%; }
    .row[data-type="switch"] > .row-name { flex: 1; }
    .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .dot { flex: none; width: 8px; height: 8px; border-radius: var(--radius-pill); opacity: 0; }
    .dot[data-src="eop"] { background: var(--dot-eop); }
    .dot[data-src="pg"]  { background: var(--dot-pg); }
    .dot[data-src="el"]  { background: var(--dot-el); }

    .val { flex: none; min-width: 48px; text-align: right; font-family: var(--font-mono); font-size: var(--text-sm); color: var(--muted); white-space: nowrap; }

    .hslider { position: relative; flex: 1; min-width: 0; height: var(--tl-touch-target); display: grid; align-items: center; }
    .track { position: relative; height: 16px; border-radius: 8px; background: var(--border-soft); overflow: hidden; }
    .fill { position: absolute; inset: 0; border-radius: 8px; background: var(--accent); transform: translateX(calc((var(--p, 0) - 1) * 100%)); }
    .fill::after { content: ""; position: absolute; right: 6px; top: 4px; bottom: 4px; width: var(--tl-slider-thumb); border-radius: var(--radius-pill); background: var(--accent-on); }
    .rng { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .hslider:has(.rng:focus-visible) .track, .vslider:has(.rng:focus-visible) .vtrack { outline: 2px solid var(--accent); outline-offset: 2px; }

    .legend { display: flex; gap: var(--space-2); padding: var(--space-2) 0 var(--space-3); }
    .lg { width: 96px; display: grid; justify-items: center; gap: 6px; }
    .vslider { position: relative; width: var(--tl-slider-track); height: var(--tl-slider-length); }
    .vtrack { position: absolute; inset: 0; border-radius: 14px; background: var(--border-soft); overflow: hidden; }
    .vfill { position: absolute; inset: 0; border-radius: 14px; background: var(--accent); transform: translateY(calc((1 - var(--p, 0)) * 100%)); }
    .vfill::after { content: ""; position: absolute; top: 6px; left: 8px; right: 8px; height: var(--tl-slider-thumb); border-radius: var(--radius-pill); background: var(--accent-on); }
    .vslider .rng { writing-mode: vertical-lr; direction: rtl; }
    .lg-label { display: flex; align-items: center; gap: 6px; max-width: 100%; }
    .lg-label .row-name { font-size: var(--text-sm); }
    .lg-label .val { min-width: 0; text-align: left; }

    .segments { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--tl-segment-gap); min-width: 0; }
    .row:not(.stacked) .segments { flex: 1; }
    .segment {
      min-width: 0; height: var(--tl-touch-target); padding: 0 var(--space-2); border: 0; cursor: pointer;
      border-radius: var(--tl-segment-inner-radius); background: var(--border-soft); color: var(--fg);
      font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background-color var(--fx-colour), color var(--fx-colour);
    }
    .segment:first-child { border-start-start-radius: var(--tl-segment-radius); border-end-start-radius: var(--tl-segment-radius); }
    .segment:last-child  { border-start-end-radius: var(--tl-segment-radius); border-end-end-radius: var(--tl-segment-radius); }
    .segment[aria-pressed="true"] { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }

    .switch {
      flex: none; width: 52px; height: 32px; border-radius: var(--radius-pill); border: 0; position: relative; cursor: pointer;
      background: var(--border); transition: background-color var(--fx-colour);
    }
    .switch::after {
      content: ""; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: var(--radius-pill);
      background: var(--muted); transition: transform var(--motion-base) var(--ease-standard), background-color var(--fx-colour);
    }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(20px) scale(1.5); background: var(--accent-on); }

    .picks { display: flex; gap: var(--space-2); overflow-x: auto; scrollbar-width: none; margin: 0 calc(var(--space-4) * -1); padding: 0 var(--space-4); }
    .picks::-webkit-scrollbar { display: none; }
    .pick { flex: none; width: 80px; display: grid; gap: var(--space-1); padding: 0; border: 0; background: transparent; cursor: pointer; }
    .pv {
      position: relative; display: grid; place-items: center; height: 56px; overflow: hidden;
      border-radius: var(--space-3); background: var(--border-soft); color: var(--fg);
      box-shadow: inset 0 0 0 2px transparent; transition: box-shadow var(--fx-colour);
    }
    .pick[aria-pressed="true"] .pv { box-shadow: inset 0 0 0 2px var(--accent); }
    .pc { display: block; font-size: var(--text-sm); color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pick[aria-pressed="true"] .pc { color: var(--fg); }

    .pv-clock { font-family: var(--font-mono); font-size: var(--text-base); }
    .pv-flip { display: flex; gap: 2px; }
    .pv-flip b { font-family: var(--font-display); font-size: var(--text-base); font-weight: 500; padding: 2px 4px; border-radius: 4px; background: var(--surface); }
    .mini { position: relative; display: block; width: 28px; height: 44px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--muted); }
    .mini i { position: absolute; display: block; background: var(--fg); border-radius: 2px; }
    .mini .bar-top { left: 4px; right: 4px; top: 4px; height: 4px; }
    .mini .bar-floating { left: 7px; right: 7px; top: 8px; height: 4px; }
    .mini .bar-bottom { left: 4px; right: 4px; bottom: 9px; height: 4px; }
    .mini .dk-docked { left: 1.5px; right: 1.5px; bottom: 1.5px; height: 7px; border-radius: 0 0 4px 4px; }
    .mini .dk-floating { left: 5px; right: 5px; bottom: 5px; height: 5px; border-radius: 3px; }
    .pvd { position: relative; display: block; width: 56px; height: 28px; }
    .pvd::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; border-radius: 4px; background: var(--muted); opacity: 0.55; }
    .pvd i { position: absolute; bottom: 4px; width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--fg); }
    .pvd i:nth-child(1) { left: 4px; } .pvd i:nth-child(2) { left: 17px; } .pvd i:nth-child(3) { left: 30px; } .pvd i:nth-child(4) { left: 43px; }
    .pvd.d-beads::before { display: none; }
    .pvd.d-beads i { box-shadow: 0 0 0 3px color-mix(in srgb, var(--muted) 55%, transparent); bottom: 6px; }
    .pvd.d-strip::before { height: 3px; }
    .pvd.d-strip i { bottom: 6px; }
    .pvd.d-peek i { bottom: 8px; }
    .pv-term { font-family: var(--font-mono); font-size: var(--text-sm); display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
    .pv-term .c { display: inline-block; width: 7px; height: 14px; background: var(--fg); }
    .pv-term.fx-scanlines { background: repeating-linear-gradient(to bottom, color-mix(in srgb, var(--fg) 12%, transparent) 0 1px, transparent 1px 3px); padding: 6px; }
    .pv-term.fx-glow { text-shadow: 0 0 6px var(--accent); }
    .pv-wp { position: absolute; inset: 0; }

    .link { width: 100%; justify-content: space-between; border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left; --od-icon-size: var(--tl-glyph); color: var(--fg); }
    .more-btn { width: 100%; justify-content: space-between; border: 0; border-top: 1px solid var(--border-soft); background: transparent; padding: 0; margin-top: var(--space-2); cursor: pointer; --od-icon-size: var(--tl-glyph); color: var(--fg); }
    .more-btn .nm, .link .nm { font-size: var(--text-base); }

    /* ─── Home actions sheet (launcher mode) ─── */
    .scrim { position: absolute; inset: 0; z-index: 6; background: black; opacity: 0; }
    .actions {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 7;
      --c-primary: var(--accent); --c-secondary: var(--meta); --c-tertiary: var(--tl-tertiary);
      padding: 0 var(--space-4) calc(var(--phone-safe-bottom) + var(--space-4));
      border-radius: var(--g-rad) var(--g-rad) 0 0;
    }
    .actions .handle-zone { height: 24px; }
    .actions[data-handle="false"] .handle { visibility: hidden; }
    .actions-title { margin: 0 0 var(--space-3); font-family: var(--font-display); font-size: var(--text-3xl); font-weight: 400; line-height: var(--leading-tight); color: var(--accent); }

    const state = { mode: 'editor', page: 'home', card: 'dock', lastSurface: 'dock', detent: 'half', tapDir: 1, wallpaper: false, more: {}, scope: {} };

    function whereOptions(id) {
      const c = CARDS[id];
      if (c.kind === 'global') return ['all', 'home', 'terminal'];
      if (c.kind === 'page') return ['all', c.page];
      return ['all', state.page];
    }
    function whatOptions(id) {
      const c = CARDS[id];
      if (c.kind === 'global') return ['all', 'statusbar', 'dock', 'terminal', 'keyboard', 'widgets', 'sheets'];
      if (c.kind === 'page') return ['all', ...Object.keys(ON_PAGE).filter(e => e !== 'wallpaper' && e !== 'sheets' && ON_PAGE[e].includes(c.page))];
      if (c.kind === 'wallpaper') return ['wallpaper'];
      return ['all', c.el];
    }
    function scopeOf(id) {
      const c = CARDS[id];
      let sc = state.scope[id];
      if (!sc) {
        sc = state.scope[id] = c.kind === 'global' ? { where: 'all', what: 'all' }
          : c.kind === 'page' ? { where: c.page, what: 'all' }
          : { where: 'all', what: c.el };
      }
      if ((c.kind === 'element' || c.kind === 'wallpaper') && sc.where !== 'all') sc.where = state.page;
      return sc;
    }
    const chainOf = (w, e) => [...new Set([`${w}|${e}`, `all|${e}`, `${w}|all`, 'all|all'])];
    function resolve(key, w, e) {
      for (const cell of chainOf(w, e)) { const vals = VALUES[cell]; if (vals && key in vals) return { v: vals[key], cell }; }
      return { v: DEFAULTS[key], cell: 'all|all' };
    }
    function srcOf(cell) {
      const [w, e] = cell.split('|');
      if (w !== 'all' && e !== 'all') return 'eop';
      if (e !== 'all') return 'el';
      if (w !== 'all') return 'pg';
      return '';
    }
    function cellText(cell) {
      const [w, e] = cell.split('|');
      if (w !== 'all' && e !== 'all') return `${EL_NAME[e]} on ${PAGE_NAME[w]}`;
      if (e !== 'all') return `${EL_NAME[e]}, everywhere`;
      if (w !== 'all') return PAGE_NAME[w];
      return 'the shared value';
    }
    const hasOverride = (cell, key) => cell === 'all|all' ? VALUES[cell][key] !== DEFAULTS[key] : !!(VALUES[cell] && key in VALUES[cell]);

    /* ═══ Hosts: the card sheet and the Wallpaper page share one renderer ═══ */
    const hosts = {
      sheet: { el: sheet, body: $('#body'), where: $('#chipWhere'), what: $('#chipWhat'), get card() { return state.card; } },
      wp:    { el: wpage, body: $('#wpBody'), where: $('#wpChipWhere'), what: $('#wpChipWhat'), get card() { return 'wallpaper'; } },
    };
    const cellOf = host => { const sc = scopeOf(host.card); return `${sc.where}|${sc.what}`; };

    function renderChip(host, which) {
      const id = host.card, sc = scopeOf(id), v = sc[which];
      const opts = which === 'where' ? whereOptions(id) : whatOptions(id);
      const chip = host[which];
      const label = which === 'where' ? (v === 'all' ? 'Everywhere' : PAGE_NAME[v]) : EL_NAME[v];
      const ic = which === 'where' ? (v === 'all' ? 'globe' : 'page') : (v === 'all' ? 'layers' : 'target');
      chip.innerHTML = `<span class="chip-in">${icon(ic)}<span class="chip-label">${label}</span></span>${opts.length > 1 ? icon('chevD') : ''}`;
      chip.setAttribute('aria-label', `${which === 'where' ? 'Where it applies' : 'What it applies to'}: ${label}`);
      chip.dataset.narrow = String(v !== 'all' && opts.length > 1);
      if (opts.length < 2) chip.setAttribute('aria-disabled', 'true'); else chip.removeAttribute('aria-disabled');
    }
    function renderHeader(host) {
      if (host === hosts.sheet) {
        const c = CARDS[host.card];
        $('#titleGlyph').innerHTML = icon(c.icon);
        $('#titleText').textContent = c.title;
        sheet.setAttribute('aria-label', `${c.title} card`);
      }
      renderChip(host, 'where'); renderChip(host, 'what');
    }

    function nameHTML(key) {
      return `<span class="row-name" tabindex="0" aria-haspopup="menu"><span class="nm">${ROW[key].label}</span><i class="dot" aria-hidden="true"></i></span>`;
    }
    function preview(key, v) {
      switch (key) {
        case 'clockFace':
          if (v === 'digits') return '<span class="pv-clock">10:56</span>';
          if (v === 'flip') return '<span class="pv-flip"><b>10</b><b>56</b></span>';
          return '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 12V6.5M12 12l4 2.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
        case 'position': return `<span class="mini"><i class="bar-${v}"></i></span>`;
        case 'dockStyle': return `<span class="mini"><i class="dk-${v}"></i></span>`;
        case 'dockDesign': return `<span class="pvd d-${v}"><i></i><i></i><i></i><i></i></span>`;
        case 'trail': {
          const n = { none: 0, short: 2, long: 4 }[v];
          const ghosts = Array.from({ length: n }, (_, i) => `<i class="c" style="opacity:${(0.12 + i * 0.1).toFixed(2)}"></i>`).join('');
          return `<span class="pv-term">❯ ${ghosts}<i class="c"></i></span>`;
        }
        case 'effect': return `<span class="pv-term fx-${v}">❯ ls</span>`;
        case 'image': return `<span class="pv-wp" style="background: var(--wp-${v})"></span>`;
      }
      return '';
    }
    function rowHTML(key) {
      const d = ROW[key];
      switch (d.type) {
        case 'segment':
          return `<div class="row${d.stacked ? ' stacked' : ''}" data-row="${key}" data-type="segment">${nameHTML(key)}<div class="segments" role="group" aria-label="${d.label}">${d.options.map(([v, l]) => `<button type="button" class="segment" aria-pressed="false" data-v="${v}">${l}</button>`).join('')}</div></div>`;
        case 'slider':
          return `<div class="row" data-row="${key}" data-type="slider">${nameHTML(key)}<div class="hslider"><div class="track"><div class="fill"></div></div><input type="range" class="rng" min="${d.min}" max="${d.max}" step="${d.step}" aria-label="${d.label}" /></div><output class="val"></output></div>`;
        case 'switch':
          return `<div class="row" data-row="${key}" data-type="switch">${nameHTML(key)}<button type="button" class="switch" role="switch" aria-checked="false" aria-label="${d.label}"></button></div>`;
        case 'picker':
          return `<div class="row stacked" data-row="${key}" data-type="picker">${nameHTML(key)}<div class="picks" role="group" aria-label="${d.label}">${d.options.map(([v, l]) => `<button type="button" class="pick" aria-pressed="false" data-v="${v}"><span class="pv" aria-hidden="true">${preview(key, v)}</span><span class="pc">${l}</span></button>`).join('')}</div></div>`;
        case 'link':
          return `<button type="button" class="row link" data-action="${d.action}"><span class="nm">${d.label}</span>${icon('chevR')}</button>`;
      }
      return '';
    }
    function legendHTML(keys, label) {
      return `<div class="legend" role="group" aria-label="${label}">${keys.map(k => {
        const d = ROW[k];
        return `<div class="lg" data-row="${k}" data-type="legend"><div class="vslider"><div class="vtrack"><div class="vfill"></div></div><input type="range" class="rng" min="${d.min}" max="${d.max}" step="${d.step}" aria-label="${d.label}" /></div><div class="lg-label">${nameHTML(k)}<output class="val"></output></div></div>`;
      }).join('')}</div>`;
    }
    function renderBody(host) {
      const id = host.card, L = layoutOf(id);
      const part = list => list.map(k => Array.isArray(k) ? legendHTML(k, id === 'wallpaper' ? 'Wallpaper' : 'Glass') : rowHTML(k)).join('');
      const open = !!state.more[id];
      host.body.innerHTML = `<div class="rows">${part(L.main)}</div><button type="button" class="row more-btn" aria-expanded="${open}"><span class="nm">More</span>${icon('chevD')}</button><div class="rows more"${open ? '' : ' hidden'}>${part(L.more)}</div>`;
      const chev = $('.more-btn svg', host.body);
      chev._r = open ? 180 : 0; chev.style.transform = `rotate(${chev._r}deg)`;
      refresh(host, false, false);
    }

    function showRow(rowEl, v, anim) {
      const key = rowEl.dataset.row, d = ROW[key], t = rowEl.dataset.type;
      if (t === 'slider' || t === 'legend') {
        const inp = $('.rng', rowEl), box = $(t === 'slider' ? '.hslider' : '.vslider', rowEl), out = $('.val', rowEl);
        inp.value = v; inp.setAttribute('aria-valuetext', key === 'frost' ? `blur ${d.fmt(v)}` : d.fmt(v));
        const draw = x => { rowEl._shown = x; box.style.setProperty('--p', clamp((x - d.min) / (d.max - d.min), -0.06, 1.06)); out.textContent = d.fmt(clamp(Math.round(x), d.min, d.max)); };
        const from = rowEl._shown ?? v;
        if (anim && from !== v) spring(keyOf(rowEl), { from, to: v, spr: SPR.spatialFast, eps: (d.max - d.min) * 0.001, onUpdate: draw });
        else { stop(keyOf(rowEl)); draw(v); }
      } else if (t === 'segment' || t === 'picker') {
        $$('[data-v]', rowEl).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(v))));
      } else if (t === 'switch') {
        $('.switch', rowEl).setAttribute('aria-checked', String(!!v));
      }
    }
    function setDot(rowEl, cell, anim) {
      const dot = $('.dot', rowEl), name = $('.row-name', rowEl), src = srcOf(cell);
      name.setAttribute('aria-label', `${ROW[rowEl.dataset.row].label}, from ${cellText(cell)}. Enter opens row options.`);
      if ((dot.dataset.src || '') === src) return;
      if (!anim) { dot.dataset.src = src; setOp(dot, src ? 1 : 0); return; }
      const g = dot._g = (dot._g || 0) + 1;
      const show = () => { if (dot._g !== g) return; dot.dataset.src = src; if (src) fade(dot, 1, 'effectsDefault'); };
      if (dot.dataset.src && (dot._op ?? 0) > 0.01) fade(dot, 0, 'effectsFast').then(show); else show();
    }
    function refreshRow(host, rowEl, animV, animD) {
      const sc = scopeOf(host.card), r = resolve(rowEl.dataset.row, sc.where, sc.what);
      showRow(rowEl, r.v, animV); setDot(rowEl, r.cell, animD);
    }
    function refresh(host, animV, animD = animV) { $$('[data-row]', host.body).forEach(el => refreshRow(host, el, animV, animD)); }

    function write(host, key, v) {
      const cell = cellOf(host), vals = VALUES[cell] || (VALUES[cell] = {}), sc = scopeOf(host.card);
      vals[key] = v;
      if (key === 'look' && LOOKS[v]) { Object.assign(vals, LOOKS[v]); refresh(host, true); }
      else {
        if (['frost', 'opacity', 'tint'].includes(key) && resolve('look', sc.where, sc.what).v !== 'custom') vals.look = 'custom';
        refresh(host, false, true);
      }
      applyLive();
    }
    function resetRow(host, key) {
      const cell = cellOf(host);
      if (!hasOverride(cell, key)) return;
      if (cell === 'all|all') VALUES[cell][key] = DEFAULTS[key]; else delete VALUES[cell][key];
      const rowEl = $(`[data-row="${key}"]`, host.body);
      if (rowEl) refreshRow(host, rowEl, true, true);
      applyLive();
    }
    function resetCard(host) {
      const cell = cellOf(host);
      cardKeys(host.card).filter(k => hasOverride(cell, k)).forEach((k, i) => setTimeout(() => resetRow(host, k), i * 30));
    }

    /* ═══ Popup menu (chips, ⋮, row long-press) ═══ */
    const menuEl = $('#menu'), menuCatch = $('#menuCatch');
    let menu = null;
    const zoomK = () => (app.getBoundingClientRect().height / G.H) || 1;
    function openMenu(anchor, cfg) {
      closeMenu(true);
      menuEl.innerHTML = (cfg.caption ? `<p class="menu-cap">${cfg.caption}</p>` : '') + cfg.items.map((it, i) => {
        const radio = it.checked !== undefined;
        return `<button type="button" class="menu-item" role="${radio ? 'menuitemradio' : 'menuitem'}"${radio ? ` aria-checked="${it.checked}"` : ''}${it.disabled ? ' aria-disabled="true"' : ''} data-i="${i}">${icon(radio ? (it.checked ? 'check' : 'blank') : it.icon)}<span class="mi-l">${it.label}</span></button>`;
      }).join('');
      menuEl.hidden = false; menuCatch.hidden = false;
      const ar = app.getBoundingClientRect(), r = anchor.getBoundingClientRect(), k = zoomK();
      const mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
      let left = clamp((r.right - ar.left) / k - mw, 8, G.W - mw - 8);
      if ((r.left - ar.left) / k < G.W / 2) left = clamp((r.left - ar.left) / k, 8, G.W - mw - 8);
      let top = (r.bottom - ar.top) / k + 4;
      if (top + mh > G.H - 8) top = Math.max(8, (r.top - ar.top) / k - mh - 4);
      menuEl.style.left = left + 'px'; menuEl.style.top = top + 'px';
      menuEl.style.transformOrigin = `${(r.left - ar.left) / k + r.width / k / 2 - left}px ${top > (r.top - ar.top) / k ? 0 : mh}px`;
      menu = { anchor, items: cfg.items };
      setOp(menuEl, 0); fade(menuEl, 1, 'effectsDefault');
      spring('menuScale', { from: 0.92, to: 1, spr: SPR.spatialFast, eps: 0.001, onUpdate: s => { menuEl.style.transform = `scale(${s})`; } });
      const first = $('.menu-item:not([aria-disabled="true"])', menuEl) || $('.menu-item', menuEl);
      if (first) first.focus({ preventScroll: true });
    }
    function closeMenu(instant) {
      if (!menu) return;
      const a = menu.anchor; menu = null; menuCatch.hidden = true;
      if (instant) { setOp(menuEl, 0); menuEl.hidden = true; return; }
      fade(menuEl, 0, 'effectsFast').then(() => { if (!menu) menuEl.hidden = true; });
      if (a && a.isConnected) a.focus({ preventScroll: true });
    }
    menuEl.addEventListener('click', e => {
      const b = e.target.closest('.menu-item'); if (!b || !menu) return;
      const it = menu.items[+b.dataset.i]; if (it.disabled) return;
      closeMenu(); it.run();
    });
    menuEl.addEventListener('keydown', e => {
      const items = $$('.menu-item', menuEl), i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
      if (e.key === 'Tab') closeMenu(true);
    });
    menuCatch.addEventListener('pointerdown', e => { e.preventDefault(); closeMenu(); });

    function chipMenu(host, which) {
      const id = host.card, sc = scopeOf(id), opts = which === 'where' ? whereOptions(id) : whatOptions(id);
      if (opts.length < 2) return;
      openMenu(host[which], {
        caption: which === 'where' ? 'Where it applies' : 'What it applies to',
        items: opts.map(v => ({ label: which === 'where' ? (v === 'all' ? 'Everywhere' : PAGE_NAME[v]) : EL_NAME[v], checked: sc[which] === v, run: () => setScope(host, which, v) })),
      });
    }
    async function relabelChip(host, which) {
      const inner = $('.chip-in', host[which]);
      if (inner) await fade(inner, 0, 'effectsFast');
      renderChip(host, which);
      const n = $('.chip-in', host[which]); setOp(n, 0); fade(n, 1, 'effectsDefault');
    }
    function setScope(host, which, v) {
      const sc = scopeOf(host.card); if (sc[which] === v) return;
      sc[which] = v; relabelChip(host, which); refresh(host, true);
    }
    function cardMenu(host, anchor) {
      const cell = cellOf(host), n = cardKeys(host.card).filter(k => hasOverride(cell, k)).length;
      openMenu(anchor, { caption: `Editing ${cellText(cell)}`, items: [{ label: 'Reset card', icon: 'reset', disabled: n === 0, run: () => resetCard(host) }] });
    }
    function rowMenu(host, rowEl, anchor) {
      const key = rowEl.dataset.row, sc = scopeOf(host.card), r = resolve(key, sc.where, sc.what), cell = cellOf(host);
      openMenu(anchor, { caption: `${ROW[key].label}: from ${cellText(r.cell)}`, items: [{ label: 'Reset this row', icon: 'reset', disabled: !hasOverride(cell, key), run: () => resetRow(host, key) }] });
    }

    function toggleMore(host, btn) {
      const sec = btn.nextElementSibling, open = btn.getAttribute('aria-expanded') !== 'true', chev = $('svg', btn);
      btn.setAttribute('aria-expanded', String(open)); state.more[host.card] = open;
      spring(keyOf(chev) + 'rot', { from: chev._r ?? 0, to: open ? 180 : 0, spr: SPR.spatialFast, eps: 0.2, onUpdate: r => { chev._r = r; chev.style.transform = `rotate(${r}deg)`; } });
      if (open) { sec.hidden = false; setOp(sec, 0); fade(sec, 1, 'effectsDefault'); slideY(sec, 8, 0, 'spatialFast'); }
      else fade(sec, 0, 'effectsFast').then(() => { if (btn.getAttribute('aria-expanded') === 'false') sec.hidden = true; });
    }

    function bindHost(host) {
      const body = host.body;
      body.addEventListener('input', e => {
        const inp = e.target.closest('.rng'); if (!inp) return;
        write(host, inp.closest('[data-row]').dataset.row, Number(inp.value));
      });
      body.addEventListener('click', e => {
        const t = e.target;
        const opt = t.closest('.segment, .pick');
        if (opt) { write(host, opt.closest('[data-row]').dataset.row, opt.dataset.v); return; }
        const sw = t.closest('.switch');
        if (sw) { write(host, sw.closest('[data-row]').dataset.row, sw.getAttribute('aria-checked') !== 'true'); return; }
        const link = t.closest('.link');
        if (link) { if (link.dataset.action === 'wallpaper') openWallpaper(); return; }
        const more = t.closest('.more-btn');
        if (more) toggleMore(host, more);
      });
      let lp = null;
      const clear = () => { if (lp) { clearTimeout(lp.timer); lp = null; } };
      body.addEventListener('pointerdown', e => {
        const n = e.target.closest('.row-name'); if (!n) return;
        lp = { x: e.clientX, y: e.clientY, timer: setTimeout(() => { lp = null; rowMenu(host, n.closest('[data-row]'), n); }, 500) };
      });
      body.addEventListener('pointermove', e => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 8) clear(); });
      body.addEventListener('pointerup', clear);
      body.addEventListener('pointercancel', clear);
      body.addEventListener('scroll', clear, { passive: true });
      body.addEventListener('contextmenu', e => {
        const n = e.target.closest('.row-name'); if (!n) return;
        e.preventDefault(); clear(); rowMenu(host, n.closest('[data-row]'), n);
      });
      body.addEventListener('keydown', e => {
        const n = e.target.closest('.row-name');
        if (n && (e.key === 'Enter' || e.key === ' ' || e.key === 'ContextMenu')) { e.preventDefault(); rowMenu(host, n.closest('[data-row]'), n); }
      });
      host.where.addEventListener('click', () => chipMenu(host, 'where'));
      host.what.addEventListener('click', () => chipMenu(host, 'what'));
    }

    /* ═══ Launcher pages ═══ */
    const DOCK_APPS = ['phone', 'chat', 'globe', 'camera', 'music'];
    const GRID_APPS = ['mail', 'pin', 'image', 'calendar', 'clock', 'folder', 'tune', 'chat', 'music', 'camera'];
    const pillHTML = cur => `<div class="pill g" data-surface="statusbar" aria-label="Status bar">
      <span class="pill-time"><span class="face face-digits">10:56</span><span class="face face-flip"><b>10</b><b>56</b></span><svg class="face face-analog" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 12V7M12 12l3.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      <span class="pill-badge">1</span><span class="wchip"${cur === 'home' ? ' data-current' : ''}>home</span><span class="wchip"${cur === 'herdr' ? ' data-current' : ''}>herdr</span><span class="pill-add">+</span>
      <span class="pill-metrics"><span>10%</span><span>49%</span><span>30°</span></span></div>`;
    const dockHTML = () => `<div class="ldots" aria-hidden="true"><i></i><i></i></div><div class="dock" data-surface="dock" aria-label="Dock"><div class="band g"></div><div class="dock-icons">${DOCK_APPS.map(a => `<span class="bead"><span class="tile">${icon(a)}</span></span>`).join('')}</div></div>`;
    const K = (label, o = {}) => `<span class="key${o.mod ? ' key--mod' : ''}${o.acc ? ' key--accent' : ''}"${o.w ? ` style="--kw:${o.w}"` : ''}>${label}${o.ne ? `<i class="kc ne">${o.ne}</i>` : ''}${o.sw ? `<i class="kc sw">${o.sw}</i>` : ''}</span>`;
    const SPLIT = '<span class="ksplit"></span>';
    const keyboardHTML = () => `
      <div class="krow">${K('q', { ne: '1', sw: 'Esc' })}${K('w', { ne: '2', sw: '@' })}${K('e', { ne: '3', sw: '#' })}${K('r', { ne: '4', sw: '$' })}${K('t', { ne: '5', sw: '%' })}${SPLIT}${K('y', { ne: '6' })}${K('u', { ne: '7' })}${K('i', { ne: '8' })}${K('o', { ne: '9' })}${K('p', { ne: '0' })}</div>
      <div class="krow"><span class="ksp"></span>${'asdfg'.split('').map(c => K(c)).join('')}${SPLIT}${'hjkl'.split('').map(c => K(c)).join('')}<span class="ksp"></span></div>
      <div class="krow">${K('⇧', { mod: 1, w: 1.5 })}${'zxcv'.split('').map(c => K(c)).join('')}${SPLIT}${'bnm'.split('').map(c => K(c)).join('')}${K('⌫', { mod: 1, w: 1.5 })}</div>
      <div class="krow">${K('Ctrl', { mod: 1, w: 1.5 })}${K('Alt', { mod: 1, w: 1.5 })}${K('', { mod: 1, w: 2.5 })}${SPLIT}${K('', { mod: 1, w: 2.5 })}${K('←', { mod: 1 })}${K('→', { mod: 1 })}${K('↵', { acc: 1 })}</div>`;
    const pane1 = '<span class="pr">~ ❯</span> herdr\n<span class="pr">~ ❯</span> ls ~/tl-test\nbin  notes  shots\n<span class="pr">~ ❯</span> <span class="trail"><i></i><i></i><i></i><i></i></span><span class="cur"></span>';
    const pane2 = '<span class="mu">CPU</span> [||||        ] 10%\n<span class="mu">MEM</span> [||||||      ] 49%\n<span class="mu">up</span>  3 days, 4:12';
    pagesEl.innerHTML = `
      <section class="page" data-page="home" aria-label="Home page">
        <div class="wpl"></div><div class="wpdim"></div>
        ${pillHTML('home')}
        <div class="widget g" data-surface="widgets" aria-label="Clock widget"><div class="flip"><b>10</b><b>56</b></div><p class="wdate">Friday 30 October</p></div>
        <p class="widget-label">Clock</p>
        <div class="appgrid" aria-hidden="true">${GRID_APPS.map(a => `<span class="tile">${icon(a)}</span>`).join('')}</div>

      }
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (state.mode === 'editor') selectAt(e.target);
        else if (state.mode === 'launcher') openActions();
      }
    });

    /* Bar, header, wallpaper controls */
    $('#ebAppearance').addEventListener('click', () => barToggle('appearance'));
    $('#ebSheets').addEventListener('click', () => barToggle('sheets'));
    $('#ebWallpaper').addEventListener('click', () => state.wallpaper ? closeWallpaper() : openWallpaper());
    $('#ebDone').addEventListener('click', exitEditor);
    $('#moreBtn').addEventListener('click', e => cardMenu(hosts.sheet, e.currentTarget));
    $('#wpMore').addEventListener('click', e => cardMenu(hosts.wp, e.currentTarget));
    $('#wpBack').addEventListener('click', closeWallpaper);
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (menu) { closeMenu(); return; }
      if (!actions.hidden) { closeActions(); return; }
      if (state.wallpaper) closeWallpaper();
    });
    $('#optScheme').addEventListener('change', e => { if (e.target.checked) document.documentElement.dataset.scheme = 'pong-blue'; else delete document.documentElement.dataset.scheme; });
    $('#optTheme').addEventListener('change', e => { if (e.target.checked) document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; });

    /* ═══ Init ═══ */
    $$('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon)));
    bindHost(hosts.sheet); bindHost(hosts.wp);
    function layout() {
      measure();
      app.style.setProperty('--W', G.W + 'px'); app.style.setProperty('--H', G.H + 'px');
      ringEl.setAttribute('viewBox', `0 0 ${G.W} ${G.H}`);
      ebar.style.top = G.barTop + 'px'; flabel.style.top = G.labelTop + 'px';
      for (const s of [sheet, wpage]) { s.style.top = G.fullTop + 'px'; s.style.height = (G.H - G.fullTop) + 'px'; }
      stop('launcher'); stop('sheet'); stop('wp'); stop('page');
      setLauncherP(state.mode === 'editor' ? 1 : 0);
      setSheetTop(state.mode === 'editor' ? detentTop(state.detent) : G.H);
      setWpTop(state.wallpaper ? G.fullTop : G.H);
      pageX = curIdx * G.W; pagesEl.style.transform = `translateX(${-pageX}px)`;
      applyLive();
      if (state.mode === 'editor') { const t = ringTarget(state.card); if (t) { Object.assign(ring, t); drawRing(); } }
    }
    renderHeader(hosts.sheet); renderBody(hosts.sheet);
    updateBar(); updateFlabel(false); setSurfaceFocus();
    $('#handleBtn').setAttribute('aria-label', 'Sheet height: half. Activate to change.');
    setOp(ebar, 1); setOp(flabel, 1);
    layout();
    requestAnimationFrame(() => { const t = ringTarget(state.card); if (t) { Object.assign(ring, t); drawRing(); ring.op = 0; fadeRing(1); } });
    let rz = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layout); }).observe(app);
  })();
  </script>
</body>
</html>
