<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#A8C7FA", "options": ["#A8C7FA", "#D0BCFF", "#9CD49F", "#FFB77C"], "section": "Wallpaper (Material)"}, "paper": {"editor": "boolean", "default": false, "section": "Wallpaper (Material)"}, "updates": {"editor": "int", "default": 2, "min": 0, "max": 99}, "$preview": {"width": 416, "height": 900}, "tagline": {"editor": "enum", "default": "terminal goodies", "options": ["terminal goodies", "little luxuries", "for your terminal", "the good stuff"], "section": "Header"}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { cat: 'All', page: 0, sel: {} }; }
renderVals() {
const n = this.props.updates ?? 2;
const p = this.props.paper ?? false;
const TONE = {'#D0BCFF':'#6750A4','#A8C7FA':'#0B57D0','#9CD49F':'#146C2E','#FFB77C':'#8B5000'};
const a0 = (this.props.accent ?? '#A8C7FA').toUpperCase();
const accent = p ? (TONE[a0] ?? a0) : a0;
const pal = {
accent, bg: p ? '#FEF7FF' : '#141218', ink: p ? '#1D1B20' : '#E6E0E9', dim: p ? '#79747E' : '#938F99',
rule: p ? '#CAC4D0' : '#49454F', px: p ? '#1D1B20' : '#E6E0E9', tonal: accent + (p ? '1F' : '2E')
};
const APPS = [
{ n: 'dawn', c: 'Note taking', t: 'new', hot: true },
{ n: 'kitten', c: 'Tools', t: '↑ 0.49', hot: true },
{ n: 'fastfetch', c: 'Tools', t: 'installed' },
{ n: 'fish-shell', c: 'Tools', t: 'installed' },
{ n: 'sigye', c: 'Tools', t: '' },
{ n: 'claude-code', c: 'AI', t: '' },
{ n: 'opencode', c: 'AI', t: '' }
];
const PER = 6;
const cat = this.state.cat;
const list = APPS.map((a, i) => ({ ...a, i })).filter(a => cat === 'All' || a.c === cat);
const pages = Math.max(1, Math.ceil(list.length / PER));
const page = Math.min(this.state.page, pages - 1);
const shown = list.slice(page * PER, page * PER + PER);
const sel = this.state.sel;
const rows = shown.map((a, k) => {
  const on = !!sel[a.n];
  const catW = Math.ceil(a.c.length * 0.8);
  const used = 2 + 2 + 2 + a.n.length + 1 + catW + 1 + 1 + a.t.length;
  return {
    name: a.n, cat: a.c, tail: a.t, num: String(a.i + 1).padStart(2, '0'),
    dots: '·'.repeat(Math.max(2, 46 - used)),
    top: 'top:' + (500 + k * 40) + 'px',
    mark: on ? '✓' : '',
    markStyle: 'color:' + pal.accent + ';font-weight:800',
    cursor: k === 0 && !on ? 'background:' + pal.accent : 'display:none',
    nameStyle: 'color:' + (on || k === 0 ? pal.accent : pal.ink) + ';font-weight:' + (on || k === 0 ? 700 : 400),
    tailStyle: 'color:' + (a.hot ? pal.accent : pal.dim),
    toggle: () => this.setState({ sel: { ...sel, [a.n]: !on } })
  };
});
const CATS = ['All', 'Note taking', 'Tools', 'AI'];
let x = 16;
const cats = CATS.map(c => {
  const w = c.length * 8 + 24; const left = x; x += w + 8;
  const on = c === cat;
  return {
    name: c,
    style: 'left:' + left + 'px;width:' + w + 'px;background:' + (on ? pal.tonal : 'transparent') + ';color:' + (on ? pal.accent : pal.dim) + ';font-weight:' + (on ? 700 : 400) + ';box-shadow:' + (on ? 'none' : 'inset 0 0 0 1px ' + pal.rule),
    pick: () => this.setState({ cat: c, page: 0 })
  };
});
const TAG = { 'terminal goodies': ['terminal', 'goodies'], 'little luxuries': ['little', 'luxuries'], 'for your terminal': ['for your', 'terminal'], 'the good stuff': ['the good', 'stuff'] };
const tg = TAG[this.props.tagline ?? 'terminal goodies'] ?? TAG['terminal goodies'];
const selCount = Object.values(sel).filter(Boolean).length;
return {
  ...pal, updates: n, hasUpdates: n > 0, rows, cats,
  pageDots: Array.from({ length: pages }, (_, i) => i === page ? '●' : '○').join(' '),
  prev: () => this.setState({ page: Math.max(0, page - 1) }),
  next: () => this.setState({ page: Math.min(pages - 1, page + 1) }),
  hasSel: selCount > 0, selCount, lead: tg[0], script: tg[1]
};
}
}
</script>
