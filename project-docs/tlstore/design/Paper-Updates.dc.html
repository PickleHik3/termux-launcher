<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tlstore updates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,700;0,800;1,300;1,400&amp;display=swap">
<style>
body{margin:0;background:#050506}
a{color:inherit}a:hover{opacity:.8}
.tty{position:relative;overflow:hidden;font-family:"JetBrains Mono",monospace;font-size:13.333px;line-height:20px}
.t{position:absolute;white-space:pre;height:20px}
.im{position:absolute;box-sizing:border-box}
.art{background-color:#2a2622;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.3px);background-size:6px 6px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em}
.cur{display:inline-block;width:8px;height:20px;vertical-align:top;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fade{animation:fade 1.2s cubic-bezier(.32,.72,0,1) both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div class="tty" style="width:416px;height:900px;background:{{bg}};color:{{ink}}">
<span class="t" style="top:60px;left:104.0px;font-size:26.666px;line-height:40px;height:40px;font-weight:800">U P D A T E S</span>
<span class="t" style="top:120px;left:80.0px;font-size:13.333px;line-height:20px;height:20px;color:{{dim}}"><i>two of yours have something new</i></span>
<div class="im " style="left:16px;top:170px;width:384px;height:1px;background:{{rule}}"></div>
<span class="t" style="top:180px;left:16px;font-size:13.333px;line-height:20px;height:20px;"><span style="color:{{dim}}">01</span>  <b>kitten</b></span>
<span class="t" style="top:180px;left:272px;font-size:13.333px;line-height:20px;height:20px;"><span style="color:{{dim}}">0.48.2 →</span> <b style="color:{{accent}}">0.49</b></span>
<span class="t" style="top:220px;left:48px;font-size:13.333px;line-height:20px;height:20px;color:{{dim}}"><i>[What changed, from the upstream release</i></span>
<span class="t" style="top:240px;left:48px;font-size:13.333px;line-height:20px;height:20px;color:{{dim}}"><i> notes, two or three lines at most.]</i></span>
<div class="im " style="left:16px;top:350px;width:384px;height:1px;background:{{rule}}"></div>
<span class="t" style="top:360px;left:16px;font-size:13.333px;line-height:20px;height:20px;"><span style="color:{{dim}}">02</span>  <b>fish-shell</b></span>
<span class="t" style="top:360px;left:272px;font-size:13.333px;line-height:20px;height:20px;"><span style="color:{{dim}}">3.7 →</span> <b style="color:{{accent}}">3.8</b></span>
<span class="t" style="top:400px;left:48px;font-size:13.333px;line-height:20px;height:20px;color:{{dim}}"><i>[What changed in fish, and in our setup.</i></span>
<span class="t" style="top:420px;left:48px;font-size:13.333px;line-height:20px;height:20px;color:{{dim}}"><i>]</i></span>
<div class="im " style="left:16px;top:530px;width:384px;height:1px;background:{{rule}}"></div>
<span class="t" style="top:840px;left:32px;font-size:13.333px;line-height:20px;height:20px;"><span style="color:{{accent}}">enter</span>  <span style="color:{{dim}}">update this</span></span><span class="t" style="top:840px;left:224px;font-size:13.333px;line-height:20px;height:20px;"><span style="color:{{accent}}">a</span>      <span style="color:{{dim}}">update all</span></span><span class="t" style="top:860px;left:32px;font-size:13.333px;line-height:20px;height:20px;"><span style="color:{{accent}}">esc</span>    <span style="color:{{dim}}">back</span></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#A8C7FA", "options": ["#A8C7FA", "#D0BCFF", "#9CD49F", "#FFB77C"], "section": "Wallpaper (Material)"}, "paper": {"editor": "boolean", "default": false, "section": "Wallpaper (Material)"}, "$preview": {"width": 416, "height": 900}}'>
class Component extends DCLogic {
renderVals() {
const n = this.props.updates ?? 2;
const p = this.props.paper ?? false;
const TONE = {'#D0BCFF':'#6750A4','#A8C7FA':'#0B57D0','#9CD49F':'#146C2E','#FFB77C':'#8B5000'};
const a0 = (this.props.accent ?? '#A8C7FA').toUpperCase();
const accent = p ? (TONE[a0] ?? a0) : a0;
const pal = {
accent, bg: p ? '#FEF7FF' : '#141218', ink: p ? '#1D1B20' : '#E6E0E9', dim: p ? '#79747E' : '#938F99',
rule: p ? '#CAC4D0' : '#49454F', px: p ? '#1D1B20' : '#E6E0E9', tonal: accent + (p ? '1F' : '2E')
};
return { ...pal, updates: n, hasUpdates: n > 0 };
}
}
</script>
</body>
</html>
